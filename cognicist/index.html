<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognicist One Day</title>
<meta name="description" content="Cognicist one-day interactive prototype: Grounding, Whether Report, Speakers in Focus, FourThought and Connec.to.me.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Cognicist One-Day Interactive Prototype — Living Garden design system (src/styles.css)
 * Fonts are loaded by the HTML <link>; every stack falls back to system faces.
 * Theme: [data-theme] may sit on <html> or <body>. Phase glow: body[data-phase].
 * Invariants: Verity fills grow from the 0.50 midline (left = dark red, right = gold).
 *             Valence fills grow from 0 (left = coral, right = green). Never inverted.
 */

/* ============================================================ 1. Tokens */
:root,
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #07110f; --surface: #172722; --surface-raised: #20332c; --surface-sunken: #0c1916;
  --border: #3f554a; --border-strong: #637b6b;
  --text: #f3f6ee; --text-muted: #b9c6b4; --text-soft: #cfe4d6;
  --brand: #78bfa2; --brand-light: #a8e6cf; --on-brand: #07110f;
  --iris: #82e4d8; --iris-text: #a9f0e6;
  --rules: #9d8cd6; --rules-text: #c9bdf5;
  --verity-false: #b84750; --verity-false-text: #e39aa0; --verity-true: #e3c34a; --verity-true-text: #e3c34a;
  --valence-neg: #cf796b; --valence-pos: #6bb493;
  --speaker-violet: #a99bff; --speaker-blue: #5fb0ff; --speaker-orange: #ffa463;

  /* derived (not part of the official palette) */
  --valence-neg-text: #f0a497; --valence-pos-text: #8fd3b1;
  --speaker-violet-text: #a99bff; --speaker-blue-text: #5fb0ff; --speaker-orange-text: #ffa463;
  --on-iris: #07110f;
  --focus: #a9f0e6;
  --glow-strength: 15%;
  --sheen: rgba(255, 244, 200, 0.22);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 18px rgba(0, 0, 0, 0.22);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 18px 44px rgba(0, 0, 0, 0.42);
  --scrim: rgba(4, 10, 9, 0.72);
}

[data-theme="light"],
:root:has(body[data-theme="light"]) {
  color-scheme: light;
  --bg: #f7f2e7; --surface: #fffaf1; --surface-raised: #eee5d6; --surface-sunken: #e8decb;
  --border: #789084; --border-strong: #405f55;
  --text: #21362f; --text-muted: #4b6257; --text-soft: #385447;
  --brand: #327e68; --brand-light: #246b57; --on-brand: #fbfff9;
  --iris: #006e62; --iris-text: #005d53;
  --rules: #6956a3; --rules-text: #51417e;
  --verity-false: #7f2630; --verity-false-text: #7f2630; --verity-true: #9a7300; --verity-true-text: #745600;
  --valence-neg: #a74e42; --valence-pos: #2f7c5b;
  --speaker-violet: #5f4fbf; --speaker-blue: #2c6fa8; --speaker-orange: #9c5725;

  --valence-neg-text: #8a3b31; --valence-pos-text: #23634a;
  --speaker-violet-text: #5445b0; --speaker-blue-text: #1f5a8c; --speaker-orange-text: #84461a;
  --on-iris: #fbfff9;
  --focus: #005d53;
  --glow-strength: 22%;
  --sheen: rgba(255, 255, 255, 0.55);
  --shadow-1: 0 1px 2px rgba(60, 48, 20, 0.1), 0 6px 18px rgba(60, 48, 20, 0.08);
  --shadow-2: 0 2px 6px rgba(60, 48, 20, 0.14), 0 18px 44px rgba(60, 48, 20, 0.16);
  --scrim: rgba(60, 52, 36, 0.5);
}

:root,
[data-theme] {
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-pill: 999px;
  --gap: 16px;
  --tap: 44px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  /* circadian accents, resolved from theme tokens */
  --dawn: var(--verity-true); --sage: var(--brand); --noon: var(--iris);
  --ochre: var(--speaker-orange); --dusk: var(--rules);
  --phase-accent: var(--brand-light);
  --glow-a: var(--verity-true); --glow-b: var(--brand);
  /* four thought types */
  --type-reflection: var(--speaker-blue-text); --type-statement: var(--brand-light);
  --type-prediction: var(--rules-text); --type-question: var(--speaker-orange-text);
}

/* ============================================================ 2. Base */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden; overflow-x: clip;
  position: relative; isolation: isolate;
}
/* Circadian backdrop: ambient glow only, behind everything, never under text at strength. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 46% at 12% -6%, color-mix(in srgb, var(--glow-a) var(--glow-strength), transparent), transparent 70%),
    radial-gradient(ellipse 60% 42% at 92% 0%, color-mix(in srgb, var(--glow-b) var(--glow-strength), transparent), transparent 72%);
  transition: opacity 600ms var(--ease);
}
body[data-phase="grounding"]   { --glow-a: var(--dawn);  --glow-b: var(--sage);  --phase-accent: var(--verity-true-text); }
body[data-phase="whether"]     { --glow-a: var(--sage);  --glow-b: var(--dawn);  --phase-accent: var(--brand-light); }
body[data-phase="speakers"]    { --glow-a: var(--noon);  --glow-b: var(--sage);  --phase-accent: var(--iris-text); }
body[data-phase="fourthought"] { --glow-a: var(--ochre); --glow-b: var(--valence-pos); --phase-accent: var(--speaker-orange-text); }
body[data-phase="connectome"]  { --glow-a: var(--dusk);  --glow-b: var(--noon);  --phase-accent: var(--rules-text); }

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; line-height: 1.2; margin: 0 0 0.4em; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0 0 0.8em; }
p:last-child { margin-bottom: 0; }
a { color: var(--iris-text); text-underline-offset: 3px; }
svg { max-width: 100%; }
img, video { max-width: 100%; height: auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, [aria-disabled="true"] { cursor: default; }
::selection { background: color-mix(in srgb, var(--iris) 35%, transparent); }

:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }

input[type="text"], input[type="search"], input[type="email"], input:not([type]), textarea, select,
.input, .textarea {
  width: 100%; min-height: var(--tap); padding: 10px 14px;
  background: var(--surface-sunken); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
}
textarea, .textarea { min-height: 112px; resize: vertical; line-height: 1.6; }
input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 0.85; }
input:hover, textarea:hover, select:hover { border-color: var(--brand); }
input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--border-strong); border-radius: var(--r-md);
}
label, .label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; letter-spacing: 0.01em; }

* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

.mono, code, kbd {
  font-family: var(--font-mono); font-size: 0.82em; font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em; overflow-wrap: anywhere;
}

/* ============================================================ 3. Shell & navigation */
.app-shell {
  width: 100%; max-width: 1240px; margin: 0 auto; padding: 20px 24px 0;
  min-width: 0; overflow-x: clip;
}
.top-bar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: 12px 20px; padding-bottom: 16px;
}
.brand-lockup {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; min-width: 0;
  font-family: var(--font-display); font-size: 1.35rem; font-weight: 500; color: var(--text); letter-spacing: -0.01em;
}
.brand-lockup small, .brand-lockup .brand-tagline, .brand-lockup .mono {
  font-family: var(--font-body); font-size: 0.8rem; font-weight: 400; color: var(--text-muted); letter-spacing: 0;
}
.top-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

/* Day-arc rail: one horizon line, dawn gold to twilight violet, with a sun on the active surface. */
.circadian-rail {
  position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;
  padding: 12px 8px 8px; margin: 0; list-style: none;
  border: 1px solid var(--border); border-radius: var(--r-lg);
  background:
    linear-gradient(90deg,
      color-mix(in srgb, var(--dawn) 9%, transparent),
      color-mix(in srgb, var(--noon) 7%, transparent) 45%,
      color-mix(in srgb, var(--ochre) 8%, transparent) 70%,
      color-mix(in srgb, var(--dusk) 11%, transparent)),
    var(--surface);
  box-shadow: var(--shadow-1);
}
.phase-pill {
  --seg-a: var(--sage); --seg-b: var(--sage);
  position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
  min-width: 0; min-height: 66px; padding: 18px 12px 10px 14px;
  background: transparent; color: var(--text-muted); text-align: left; text-decoration: none;
  border: 1px solid transparent; border-radius: var(--r-md);
  cursor: pointer; scroll-snap-align: center;
  transition: background-color 200ms var(--ease), border-color 200ms var(--ease), color 200ms var(--ease);
}
.phase-pill:nth-child(1), .phase-pill[data-phase="grounding"]   { --seg-a: var(--dawn);  --seg-b: var(--sage); }
.phase-pill:nth-child(2), .phase-pill[data-phase="whether"]     { --seg-a: var(--sage);  --seg-b: var(--noon); }
.phase-pill:nth-child(3), .phase-pill[data-phase="speakers"]    { --seg-a: var(--noon);  --seg-b: var(--ochre); }
.phase-pill:nth-child(4), .phase-pill[data-phase="fourthought"] { --seg-a: var(--ochre); --seg-b: var(--dusk); }
.phase-pill:nth-child(5), .phase-pill[data-phase="connectome"]  { --seg-a: var(--dusk);  --seg-b: var(--dusk); }
/* horizon segment */
.phase-pill::before {
  content: ""; position: absolute; left: -3px; right: -3px; top: 5px; height: 3px; border-radius: 3px;
  background: linear-gradient(90deg, var(--seg-a), var(--seg-b)); opacity: 0.5;
}
/* sun / moon marker riding the horizon */
.phase-pill::after {
  content: ""; position: absolute; left: 14px; top: -1px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--seg-a);
  transition: box-shadow 300ms var(--ease), background-color 300ms var(--ease);
}
.phase-pill:hover { background: color-mix(in srgb, var(--surface-raised) 70%, transparent); color: var(--text); }
.phase-pill.is-done { color: var(--text-soft); }
.phase-pill.is-done::before { opacity: 0.85; }
.phase-pill.is-done::after { background: var(--seg-a); }
.phase-pill.is-active {
  background: var(--surface-raised); border-color: var(--border-strong); color: var(--text);
  box-shadow: var(--shadow-1);
}
.phase-pill.is-active::before { opacity: 1; }
.phase-pill.is-active::after {
  background: var(--seg-a);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--seg-a) 24%, transparent), 0 0 16px color-mix(in srgb, var(--seg-a) 70%, transparent);
}
.phase-time { font-family: var(--font-mono); font-size: 0.7rem; font-variant-numeric: tabular-nums; color: var(--text-muted); letter-spacing: 0.02em; white-space: nowrap; }
.phase-name { font-family: var(--font-display); font-size: 1.02rem; font-weight: 500; line-height: 1.2; color: inherit; overflow-wrap: anywhere; }
.phase-pill.is-active .phase-time { color: var(--text-soft); }

.main-stage { padding: 28px 0 150px; min-width: 0; }
.surface-header { max-width: 760px; margin-bottom: 24px; }
.surface-eyebrow {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--phase-accent);
}
.surface-eyebrow::before { content: ""; width: 18px; height: 1px; background: currentColor; opacity: 0.7; }
.surface-title { font-family: var(--font-display); font-size: clamp(1.9rem, 1.3rem + 2.4vw, 2.75rem); font-weight: 500; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 10px; color: var(--text); }
.surface-sub { font-size: 1.04rem; color: var(--text-muted); max-width: 62ch; margin: 0; }

/* ============================================================ 4. Layout, panels, controls */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
.grid-2 > *, .grid-3 > * { min-width: 0; }

.panel, .panel-raised, .panel-sunken {
  position: relative; min-width: 0; padding: 20px;
  border: 1px solid var(--border); border-radius: var(--r-lg);
}
.panel { background: var(--surface); box-shadow: var(--shadow-1); }
.panel-raised { background: var(--surface-raised); border-color: var(--border-strong); box-shadow: var(--shadow-2); }
.panel-sunken { background: var(--surface-sunken); box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.12); }
.panel-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 500; line-height: 1.25; margin: 0 0 4px; color: var(--text); }
.panel-sub { font-size: 0.9rem; color: var(--text-muted); margin: 0 0 14px; }
.divider { height: 1px; border: 0; margin: 16px 0; background: linear-gradient(90deg, transparent, var(--border) 12%, var(--border) 88%, transparent); }
.meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 0.84rem; color: var(--text-muted); min-width: 0; }

.btn, .pill-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 10px 18px; max-width: 100%;
  font-family: var(--font-body); font-size: 0.94rem; font-weight: 600; line-height: 1.2; text-decoration: none; text-align: center;
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  background: var(--surface-raised); color: var(--text);
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease), transform 120ms var(--ease), box-shadow 160ms var(--ease);
}
.btn:hover { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, var(--surface-raised)); }
.btn:active, .pill-btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { color: var(--text-muted); border-style: dashed; background: transparent; transform: none; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: color-mix(in srgb, var(--brand) 86%, var(--text)); border-color: color-mix(in srgb, var(--brand) 86%, var(--text)); }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text-soft); }
.btn-ghost:hover { background: color-mix(in srgb, var(--surface-raised) 80%, transparent); border-color: var(--border-strong); color: var(--text); }
.btn-iris { background: var(--iris); border-color: var(--iris); color: var(--on-iris); }
.btn-iris:hover { background: color-mix(in srgb, var(--iris) 86%, var(--text)); border-color: color-mix(in srgb, var(--iris) 86%, var(--text)); }
.btn-sm { min-height: 40px; padding: 7px 13px; font-size: 0.85rem; border-radius: 10px; }

.pill-btn {
  min-height: 40px; padding: 8px 15px; font-size: 0.88rem; font-weight: 500;
  border-radius: var(--r-pill); border-color: var(--border); background: transparent; color: var(--text-soft);
}
.pill-btn:hover { border-color: var(--border-strong); color: var(--text); background: color-mix(in srgb, var(--surface-raised) 70%, transparent); }
.pill-btn.is-active, .pill-btn[aria-pressed="true"], .pill-btn[aria-selected="true"] {
  background: color-mix(in srgb, var(--brand) 20%, var(--surface)); border-color: var(--brand); color: var(--text); font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--brand);
}

.pill, .chip, .badge {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  font-size: 0.78rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border: 1px solid var(--border); border-radius: var(--r-pill);
}
.pill { padding: 4px 11px; background: var(--surface-raised); color: var(--text-soft); }
.chip { padding: 3px 10px; background: transparent; color: var(--text-muted); border-style: dashed; }
.badge {
  padding: 3px 9px; font-family: var(--font-mono); font-size: 0.72rem; font-variant-numeric: tabular-nums; letter-spacing: 0;
  background: var(--surface-sunken); color: var(--text-soft);
}
/* Verity badge: neutral until the side of the midline is stated, so a value below 0.50 is never shown gold.
   .is-true / data-sign="pos" = gold, .is-false / data-sign="neg" = dark red. */
.badge-verity { color: var(--text-soft); border-color: var(--border-strong); }
.badge-verity.is-true, .badge-verity[data-sign="pos"] { color: var(--verity-true-text); border-color: color-mix(in srgb, var(--verity-true) 55%, var(--border)); }
.badge-verity.is-false, .badge-verity[data-sign="neg"] { color: var(--verity-false-text); border-color: color-mix(in srgb, var(--verity-false) 70%, var(--border)); }
/* Valence badge: same rule. .is-pos / data-sign="pos" = green, .is-neg / data-sign="neg" = coral. */
.badge-valence { color: var(--text-soft); border-color: var(--border-strong); }
.badge-valence.is-pos, .badge-valence[data-sign="pos"] { color: var(--valence-pos-text); border-color: color-mix(in srgb, var(--valence-pos) 55%, var(--border)); }
.badge-valence.is-neg, .badge-valence[data-sign="neg"] { color: var(--valence-neg-text); border-color: color-mix(in srgb, var(--valence-neg) 60%, var(--border)); }
.badge-privacy { color: var(--rules-text); border-color: color-mix(in srgb, var(--rules) 55%, var(--border)); font-family: var(--font-body); }
.badge-privacy[data-privacy="private"] { border-style: dashed; }
/* An invitation, not a lock. */
.badge-unlock {
  font-family: var(--font-body); font-size: 0.78rem; white-space: normal; padding: 5px 12px;
  color: var(--verity-true-text); border-color: color-mix(in srgb, var(--dawn) 50%, var(--border));
  background: color-mix(in srgb, var(--dawn) 10%, var(--surface));
}

/* Speaker hues & thought types (set by data attribute or class) */
/* --hue is for dots, rules and borders; --hue-text is the AA-safe version for names and labels. */
[data-hue="violet"], .hue-violet { --hue: var(--speaker-violet); --hue-text: var(--speaker-violet-text); }
[data-hue="blue"], .hue-blue { --hue: var(--speaker-blue); --hue-text: var(--speaker-blue-text); }
[data-hue="orange"], .hue-orange { --hue: var(--speaker-orange); --hue-text: var(--speaker-orange-text); }
[data-type="reflection"], .type-reflection { --type-color: var(--type-reflection); }
[data-type="statement"], .type-statement { --type-color: var(--type-statement); }
[data-type="prediction"], .type-prediction { --type-color: var(--type-prediction); }
[data-type="question"], .type-question { --type-color: var(--type-question); }

/* Helper classes the surface modules use outside the contract list: AA-safe colors only, no layout. */
.speaker-violet { --hue: var(--speaker-violet); --hue-text: var(--speaker-violet-text); color: var(--speaker-violet-text); }
.speaker-blue   { --hue: var(--speaker-blue);   --hue-text: var(--speaker-blue-text);   color: var(--speaker-blue-text); }
.speaker-orange { --hue: var(--speaker-orange); --hue-text: var(--speaker-orange-text); color: var(--speaker-orange-text); }
.chip-reflection { --type-color: var(--type-reflection); }
.chip-statement  { --type-color: var(--type-statement); }
.chip-prediction { --type-color: var(--type-prediction); }
.chip-question   { --type-color: var(--type-question); }
.chip-reflection, .chip-statement, .chip-prediction, .chip-question {
  color: var(--type-color); border-style: solid; border-color: color-mix(in srgb, var(--type-color) 55%, var(--border));
}
.chip-btn { min-height: 40px; padding: 8px 14px; cursor: pointer; background: transparent; color: var(--text-soft); transition: border-color 160ms var(--ease), color 160ms var(--ease); }
.chip-btn:hover, .chip-btn.is-active, .chip-btn[aria-pressed="true"] { border-style: solid; border-color: var(--brand); color: var(--text); }
input[type="checkbox"], input[type="radio"] { width: 22px; height: 22px; min-height: 0; margin: 0; flex: 0 0 auto; accent-color: var(--brand); cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ============================================================ 5. Verity & Valence rails (center-out) */
.axis-control { position: relative; min-width: 0; padding: 4px 0; }
.axis-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 0.88rem; font-weight: 600; color: var(--text-soft); }
.axis-header .mono, .axis-header output { font-family: var(--font-mono); font-size: 0.86rem; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.axis-track {
  position: relative; height: 12px; border-radius: var(--r-pill);
  background: var(--surface-sunken); border: 1px solid var(--border-strong);
}
.axis-control:focus-within .axis-track { outline: 2px solid var(--focus); outline-offset: 4px; }
.axis-midline {
  position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; border-radius: 2px;
  background: var(--text-soft); z-index: 2; pointer-events: none;
}
.axis-fill { position: absolute; top: 0; bottom: 0; width: 0; min-width: 0; pointer-events: none; transition: width 180ms var(--ease); }
.axis-fill.is-verity-true, .axis-fill.is-valence-pos { left: 50%; right: auto; border-radius: 0 var(--r-pill) var(--r-pill) 0; }
.axis-fill.is-verity-false, .axis-fill.is-valence-neg { right: 50%; left: auto; border-radius: var(--r-pill) 0 0 var(--r-pill); }
.axis-fill.is-verity-true  { background: var(--verity-true); }
.axis-fill.is-verity-false { background: var(--verity-false); }
.axis-fill.is-valence-pos  { background: var(--valence-pos); }
.axis-fill.is-valence-neg  { background: var(--valence-neg); }
.axis-thumb {
  position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border-radius: 50%;
  transform: translate(-50%, -50%); z-index: 3; pointer-events: none;
  background: var(--text); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border-strong), var(--shadow-1);
}
.axis-ends { display: flex; justify-content: space-between; gap: 10px; margin-top: 9px; font-size: 0.74rem; color: var(--text-muted); }
/* Invisible native range laid over the track: keyboard + pointer input, 40px tall. */
.axis-slider-input {
  position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; margin: 0; padding: 0;
  opacity: 0; cursor: pointer; z-index: 4; -webkit-appearance: none; appearance: none; background: transparent; border: 0;
}
.axis-track .axis-slider-input { inset: -14px 0; height: calc(100% + 28px); }
.axis-slider-input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 2px; height: 40px; background: transparent; border: 0; }
.axis-slider-input::-moz-range-thumb { width: 2px; height: 40px; background: transparent; border: 0; }
.axis-slider-input::-moz-range-track { background: transparent; }

.mini-rail {
  position: relative; display: inline-block; vertical-align: middle; width: 64px; max-width: 100%; height: 6px; flex: 0 0 auto;
  border-radius: var(--r-pill); background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--border);
}
.mini-rail::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; margin-left: -0.75px; background: var(--text-muted); border-radius: 1px; }
.mini-rail .axis-midline { display: none; }

/* ============================================================ 6. Surface 1 — Grounding */
.oracle-stage {
  display: flex; flex-direction: column; align-items: center; gap: 18px; min-width: 0;
  padding: 26px 16px; perspective: 1400px;
  border-radius: var(--r-lg);
  background: radial-gradient(ellipse 60% 55% at 50% 40%, color-mix(in srgb, var(--dawn) 9%, transparent), transparent 75%);
}
.oracle-card-wrap { position: relative; width: min(300px, 100%); perspective: 1400px; margin: 0 auto; }
/* Botanical double border: gold rule, a band of ground, a fine inner leaf-green rule. */
.oracle-card {
  position: relative; display: flex; flex-direction: column; gap: 12px; width: 100%; min-width: 0;
  padding: 12px 12px 16px; text-align: center; color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--dawn) 10%, transparent), transparent 60%),
    var(--surface);
  border: 1px solid var(--verity-true); border-radius: 20px;
  box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px color-mix(in srgb, var(--brand) 65%, transparent), var(--shadow-2);
  transform-style: preserve-3d; backface-visibility: hidden; overflow: hidden;
  transition: transform 320ms var(--ease), box-shadow 320ms var(--ease);
}
button.oracle-card, .oracle-card[role="button"] { cursor: pointer; font: inherit; }
/* Face-down: a woven back with a seed-of-life sigil. */
.oracle-card:not(.is-drawn) {
  aspect-ratio: 3 / 4; align-items: center; justify-content: center; padding: 24px;
  font-family: var(--font-display); font-size: 1.06rem; color: var(--text-soft);
  background:
    radial-gradient(circle at 50% 50%, transparent 0 46px, color-mix(in srgb, var(--dawn) 55%, transparent) 46px 47px, transparent 47px 58px, color-mix(in srgb, var(--brand) 45%, transparent) 58px 59px, transparent 59px),
    repeating-linear-gradient(45deg, color-mix(in srgb, var(--brand) 13%, transparent) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(-45deg, color-mix(in srgb, var(--brand) 13%, transparent) 0 1px, transparent 1px 11px),
    var(--surface-sunken);
}
.oracle-card.is-back { padding: 12px; background:
    repeating-linear-gradient(45deg, color-mix(in srgb, var(--brand) 13%, transparent) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(-45deg, color-mix(in srgb, var(--brand) 13%, transparent) 0 1px, transparent 1px 11px),
    var(--surface-sunken); }
.oracle-card-art.oracle-card-back { background: transparent; color: var(--verity-true-text); }
.oracle-prompt { font-family: var(--font-display); font-size: 1rem; color: var(--text); }
.oracle-card:not(.is-drawn):hover { transform: translateY(-4px) rotateX(3deg) rotateY(-4deg); }
/* Metallic sheen: sweeps once on draw, again on hover. */
.oracle-card::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: linear-gradient(112deg, transparent 38%, var(--sheen) 49%, transparent 60%);
  background-size: 260% 100%; background-position: 130% 0; background-repeat: no-repeat;
  transition: background-position 900ms var(--ease);
}
.oracle-card:hover::after { background-position: -40% 0; }
.oracle-card.is-drawn { animation: oracle-reveal 820ms var(--ease) both; }
.oracle-card.is-drawn::after { animation: oracle-sheen 1300ms 380ms var(--ease) both; }
/* Add .is-settled once the reveal has played if the surface re-renders around a drawn card. */
.oracle-card.is-drawn.is-settled, .oracle-card.is-drawn.is-settled::after { animation: none; }
@keyframes oracle-reveal {
  0%   { transform: rotateY(-96deg) scale(0.94); filter: brightness(1.5); }
  55%  { transform: rotateY(7deg) scale(1.015); filter: brightness(1.08); }
  100% { transform: none; filter: none; }
}
@keyframes oracle-sheen { from { background-position: 130% 0; } to { background-position: -40% 0; } }
.oracle-card-art {
  position: relative; width: 100%; aspect-ratio: 3 / 4; flex: 0 0 auto; overflow: hidden;
  border-radius: 14px; background: var(--surface-sunken); line-height: 0;
}
.oracle-card-art svg { display: block; width: 100%; height: 100%; }
.oracle-card h3, .oracle-card h4, .oracle-card .oracle-card-title { font-family: var(--font-display); font-size: 1.32rem; font-weight: 500; margin: 0; color: var(--text); }
.oracle-card p { font-size: 0.92rem; color: var(--text-soft); text-align: left; }
.oracle-hash-receipt {
  width: 100%; max-width: 520px; padding: 10px 14px; text-align: left;
  font-family: var(--font-mono); font-size: 0.72rem; line-height: 1.6; color: var(--text-muted);
  overflow-wrap: anywhere; word-break: break-word;
  background: var(--surface-sunken); border: 1px dashed var(--border); border-radius: var(--r-md);
}
.iris-bridge-box {
  position: relative; width: 100%; padding: 16px 18px 16px 20px; text-align: left; color: var(--text);
  background: color-mix(in srgb, var(--iris) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--iris) 45%, var(--border)); border-left: 3px solid var(--iris);
  border-radius: var(--r-md);
  font-family: var(--font-display); font-size: 1.04rem; line-height: 1.6;
}
.iris-bridge-box .mono, .iris-bridge-box small { display: block; margin-bottom: 6px; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--iris-text); }

.meditation-timer { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; min-width: 0; }
/* Set --progress (0..1) on the ring to fill it clockwise. */
.timer-ring {
  position: relative; display: grid; place-items: center; width: 176px; height: 176px; max-width: 100%; flex: 0 0 auto;
  border-radius: 50%; isolation: isolate;
  font-family: var(--font-mono); font-size: 1.9rem; font-variant-numeric: tabular-nums; color: var(--text);
}
.timer-ring > * { grid-area: 1 / 1; }
.timer-ring svg { display: block; width: 100%; height: 100%; }
.timer-ring[style*="--progress"] { background: conic-gradient(var(--brand) calc(var(--progress, 0) * 1turn), var(--border) 0); }
.timer-ring[style*="--progress"]::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); z-index: -1; }

.gratitude-form { display: grid; gap: 14px; min-width: 0; }
.attribution-preview {
  padding: 12px 16px; font-size: 0.92rem; color: var(--text-soft);
  background: var(--surface-sunken); border: 1px solid var(--border); border-left: 3px solid var(--dawn);
  border-radius: var(--r-md); overflow-wrap: anywhere;
}
.attribution-preview strong, .attribution-preview .mono { color: var(--text); font-weight: 600; }

/* ============================================================ 7. Surface 2 — Whether Report */
.whether-toolbar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 20px; padding: 12px 14px;
  background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--r-lg);
}
.breaking-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; margin-bottom: 22px; }
.switch-item {
  position: relative; min-width: 0; padding: 14px 16px 14px 20px; font-size: 0.92rem; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
}
.switch-item::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: linear-gradient(var(--dawn), var(--sage)); }
button.switch-item { text-align: left; cursor: pointer; width: 100%; }
button.switch-item:hover { border-color: var(--border-strong); }

.breakfast-player {
  min-width: 0; padding: 18px 20px; margin-bottom: 22px;
  background: color-mix(in srgb, var(--iris) 6%, var(--surface-raised));
  border: 1px solid color-mix(in srgb, var(--iris) 40%, var(--border)); border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
}
.dialogue-feed { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding: 4px 4px 4px 0; margin: 14px 0; overscroll-behavior: contain; }
.dialogue-bubble {
  max-width: min(88%, 620px); padding: 11px 15px; font-size: 0.96rem; line-height: 1.55; overflow-wrap: anywhere;
  border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
}
.dialogue-bubble.is-iris {
  align-self: flex-start; border-bottom-left-radius: 5px; color: var(--text);
  background: color-mix(in srgb, var(--iris) 11%, var(--surface)); border-color: color-mix(in srgb, var(--iris) 45%, var(--border));
}
.dialogue-bubble.is-you { align-self: flex-end; border-bottom-right-radius: 5px; background: var(--surface-raised); border-color: var(--border-strong); }
.dialogue-bubble .mono { display: block; margin-bottom: 3px; font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.04em; }
.dialogue-bubble.is-iris .mono { color: var(--iris-text); }

.topic-card {
  position: relative; min-width: 0; padding: 22px; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.topic-card.is-expanded, .topic-card[aria-expanded="true"] { border-color: var(--border-strong); }
.topic-card h3, .topic-card .topic-title { font-size: 1.4rem; }
.uncertainty-pill {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 14px;
  font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; white-space: nowrap;
  color: var(--rules-text); background: color-mix(in srgb, var(--rules) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--rules) 55%, var(--border)); border-radius: var(--r-pill); cursor: pointer;
  transition: background-color 160ms var(--ease), border-color 160ms var(--ease);
}
.uncertainty-pill:hover, .uncertainty-pill[aria-expanded="true"] { background: color-mix(in srgb, var(--rules) 22%, var(--surface)); border-color: var(--rules); }
/* In-flow disclosure (never clipped, never overflows on a phone). */
.uncertainty-popover {
  position: relative; margin: 12px 0 4px; padding: 16px 18px; max-width: 560px; font-size: 0.9rem; color: var(--text);
  background: var(--surface-raised); border: 1px solid color-mix(in srgb, var(--rules) 50%, var(--border-strong));
  border-radius: var(--r-md); box-shadow: var(--shadow-2);
}
.uncertainty-popover::before {
  content: ""; position: absolute; top: -7px; left: 26px; width: 12px; height: 12px; transform: rotate(45deg);
  background: var(--surface-raised); border-left: 1px solid color-mix(in srgb, var(--rules) 50%, var(--border-strong)); border-top: 1px solid color-mix(in srgb, var(--rules) 50%, var(--border-strong));
}
.uncertainty-popover dt, .uncertainty-popover .mono { color: var(--rules-text); }
.uncertainty-popover dl { margin: 0; display: grid; gap: 8px; }
.uncertainty-popover dd { margin: 0; color: var(--text-soft); }

/* FourThought arc: question → reflection → statement → answers, on one thread. */
.ft-arc { position: relative; display: grid; gap: 14px; margin: 18px 0; padding-left: 20px; min-width: 0; }
.ft-arc::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: linear-gradient(var(--type-question), var(--type-reflection), var(--type-statement), var(--type-prediction)); opacity: 0.75; }
.ft-arc [data-type], .ft-arc .ft-step { position: relative; min-width: 0; }
.ft-arc [data-type]::before, .ft-arc .ft-step::before {
  content: ""; position: absolute; left: -21px; top: 0.5em; width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--type-color, var(--brand));
}
.ft-arc .ft-label, .ft-label { display: block; margin-bottom: 3px; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--type-color, var(--text-muted)); }
.horizon-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
.horizon-col {
  min-width: 0; padding: 14px 16px; font-size: 0.92rem;
  background: var(--surface-sunken); border: 1px solid var(--border); border-top: 3px solid var(--brand); border-radius: var(--r-md);
}
.horizon-col:nth-child(2), .horizon-col[data-horizon="near"] { border-top-style: dashed; border-top-color: var(--noon); }
.horizon-col:nth-child(3), .horizon-col[data-horizon="next"] { border-top-style: dotted; border-top-color: var(--dusk); }
.horizon-col h4, .horizon-col .horizon-label { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-soft); margin: 0 0 8px; }
.horizon-col ul { margin: 0; padding-left: 18px; }
.horizon-col li + li { margin-top: 8px; }
.roots-strip {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start; margin-top: 16px; padding: 14px 16px; font-size: 0.88rem; color: var(--text-soft);
  background: color-mix(in srgb, var(--dawn) 6%, var(--surface-sunken)); border: 1px solid var(--border); border-top: 2px solid color-mix(in srgb, var(--dawn) 70%, var(--border)); border-radius: var(--r-md);
}

/* ============================================================ 8. Surface 3 — Speakers in Focus */
.slot-tabs { display: flex; gap: 8px; margin-bottom: 20px; padding-bottom: 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; max-width: 100%; }
.slot-tabs::-webkit-scrollbar { display: none; }
.slot-tabs .pill-btn, .slot-tabs .btn { flex: 0 0 auto; }
.speaker-headline {
  position: relative; min-width: 0; padding: 26px; margin-bottom: 18px;
  background:
    radial-gradient(ellipse 80% 90% at 100% 0%, color-mix(in srgb, var(--hue, var(--noon)) 12%, transparent), transparent 70%),
    var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-2);
}
.speaker-headline h2, .speaker-headline h3 { font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.1rem); line-height: 1.12; letter-spacing: -0.015em; }
.speaker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(270px, 100%), 1fr)); gap: var(--gap); margin-bottom: 18px; }
.archive-list { display: flex; flex-direction: column; margin: 0 0 18px; padding: 0; list-style: none; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.archive-list > * { padding: 14px 18px; min-width: 0; }
.archive-list > * + * { border-top: 1px solid var(--border); }
.reader-modal {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px;
  background: var(--scrim); backdrop-filter: blur(3px); overscroll-behavior: contain;
}
.reader-panel {
  position: relative; width: 100%; max-height: none; overflow: visible; min-width: 0;
  padding: 26px 28px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-2);
}
.passage-block {
  position: relative; min-width: 0; padding: 14px 16px 14px 18px; margin: 4px 0;
  font-family: var(--font-display); font-size: 1.1rem; line-height: 1.72; color: var(--text); text-align: left;
  background: transparent; border: 0; border-left: 3px solid transparent; border-radius: 0 var(--r-md) var(--r-md) 0;
  cursor: pointer; transition: background-color 180ms var(--ease), border-color 180ms var(--ease);
}
button.passage-block { display: block; width: 100%; }
.passage-block:hover { background: color-mix(in srgb, var(--surface-raised) 60%, transparent); border-left-color: var(--border-strong); }
.passage-block.is-selected { background: color-mix(in srgb, var(--iris) 10%, var(--surface)); border-left-color: var(--iris); }
.passage-block .mono { font-size: 0.72rem; color: var(--text-muted); margin-right: 8px; }
.reaction-list { display: grid; gap: 10px; margin: 6px 0 14px 18px; padding: 0 0 0 14px; list-style: none; font-family: var(--font-body); font-size: 0.9rem; line-height: 1.5; border-left: 1px dashed var(--border-strong); }
.reaction-list > * { min-width: 0; padding: 10px 12px; background: var(--surface-sunken); border-radius: var(--r-md); }
.playlist-card {
  min-width: 0; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1);
  transition: border-color 180ms var(--ease), transform 180ms var(--ease);
}
.playlist-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.livestream-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; margin: 16px 0; padding: 14px; background: color-mix(in srgb, var(--dusk) 7%, var(--surface-sunken)); border: 1px solid var(--border); border-radius: var(--r-lg); }
.livestream-strip > * { min-width: 0; }
/* Quiet 9–5 radio: a small docked pill, bottom-left, clear of the reviewer pill. */
.ambient-bar {
  position: fixed; left: 16px; bottom: 16px; z-index: 40; display: flex; align-items: center; gap: 10px;
  width: max-content; max-width: min(440px, calc(100vw - 210px)); min-height: 48px; padding: 6px 16px 6px 8px;
  font-size: 0.84rem; color: var(--text-soft);
  background: color-mix(in srgb, var(--surface-raised) 94%, transparent); backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: var(--r-pill); box-shadow: var(--shadow-2);
}
.ambient-bar { overflow: hidden; }
.ambient-bar > *, .ambient-text, .ambient-track { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ambient-bar .btn, .ambient-bar button { flex: 0 0 auto; min-width: 40px; min-height: 40px; padding: 6px 10px; border-radius: var(--r-pill); overflow: visible; }

/* ============================================================ 9. Surface 4 — FourThought */
.ft-workspace { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--gap); align-items: start; }
.ft-workspace > * { min-width: 0; }
.drafts-inbox { display: grid; gap: 10px; min-width: 0; padding: 16px; background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--r-lg); }
.draft-card {
  display: block; width: 100%; min-width: 0; min-height: var(--tap); padding: 12px 14px; text-align: left; font-size: 0.9rem; color: var(--text);
  background: var(--surface); border: 1px dashed var(--border-strong); border-left: 3px solid var(--type-color, var(--brand)); border-radius: var(--r-md);
  cursor: pointer; transition: border-color 160ms var(--ease), background-color 160ms var(--ease);
}
.draft-card:hover, .draft-card.is-active { background: var(--surface-raised); border-style: solid; }

      "Q" + n(x + k) + " " + n(y + k) + " " + n(x) + " " + n(y + r) +
      "Q" + n(x - k) + " " + n(y + k) + " " + n(x - r) + " " + n(y) +

          passages: [
            {

              timestamp: "02:14",
              text: "A central generator treats resilience like a single fortress wall. A mycelial grid treats resilience like nutrient sharing: when one node drops voltage, three neighbors shed non-critical heat for twenty minutes without anyone noticing.",

                { id: "rx-1", author: "Devon Okafor", verity: 0.82, valence: 0.65, text: "This matches what we saw in our greenhouse sensors — graceful micro-shedding beats hard failover every time." },

            {
              id: "p-2",
              timestamp: "05:40",
              text: "The first failure mode is the hero battery. One household buys the biggest unit on the block, everyone quietly plans around it, and on night two of the outage that garage is the single wall again — only smaller, and with someone's name on it.",

                { id: "rx-3", author: "Maya Chen", verity: 0.77, valence: 0.30, text: "We did exactly this on Fern Street in 2024. It was my garage." }

            {
              id: "p-3",
              timestamp: "08:52",
              text: "The second is forgetting that heat can be stored. A slab, a water barrel, a brick wall warmed six hours before the ice arrives will carry a room through the night for a fraction of what the same comfort costs in lithium. Old-growth roots bank sugar before winter; they don't make it in January.",
              reactions: [
                { id: "rx-4", author: "Tomas Reyes", verity: 0.58, valence: 0.12, text: "True where you own the slab. Half this block rents. I'd like a version of this paragraph for people who can't pour concrete." },
                { id: "rx-5", author: "Devon Okafor", verity: 0.80, valence: 0.60, text: "Our greenhouse water barrels held 11°C through the January cold snap with the heater off." }
              ]
            },
            {
              id: "p-4",
              timestamp: "12:31",
              text: "So the question I would put to any block isn't \"how many kilowatt-hours do we have?\" It is: when the first house goes dark, how many neighbors notice — and how many of them have already agreed what they would switch off?",
              reactions: [
                { id: "rx-6", author: "Kaito Sato", verity: 0.84, valence: 0.70, text: "This is a governance sentence disguised as an engineering one." }
              ]
            }
          ]

<script>
/* ---- src/surfaces-morning.js ---- */
/* Cognicist prototype — Surface 1 (Grounding Moment) + Surface 2 (Whether Report).
 * Exposes window.CognicistMorning.renderGrounding / renderWhether. Uses helpers only via `app`. */
(function () {
  'use strict';

  /* ---------- module-owned timers / audio (cleaned on phase leave) ---------- */
  var medTimer = null;
  var bfTimer = null;
  var hookSet = false;
  var bfAskText = '';
  var pulling = false;
  var settledPullKey = null;

  function ensureLeaveHook(app) {
    if (hookSet) return;
    hookSet = true;
    app.onLeave(function () {
      hookSet = false;
      pauseMeditation(app, true);
      stopBriefing(app, true);
    });
  }

  /* ---------- hashing: real SHA-256 with deterministic FNV-1a fallback ---------- */
  function fnvHex(app, str) {
    var out = '';
    for (var i = 0; i < 8; i++) {
      var h = app.fnv1a(str + '#' + i, 0x9e3779b9 * (i + 1));
      out += ('00000000' + h.toString(16)).slice(-8);
    }
    return out;
  }
  function hashHex(app, str) {
    var subtle = window.crypto && window.crypto.subtle;
    if (subtle && typeof subtle.digest === 'function' && window.TextEncoder) {
      try {
        return subtle.digest('SHA-256', new window.TextEncoder().encode(str)).then(function (buf) {
          var b = new Uint8Array(buf), hex = '';
          for (var i = 0; i < b.length; i++) hex += (b[i] < 16 ? '0' : '') + b[i].toString(16);
          return { hex: hex, algo: 'SHA-256' };
        }, function () { return { hex: fnvHex(app, str), algo: 'FNV-1a (fallback)' }; });
      } catch (e) { /* fall through */ }
    }
    return Promise.resolve({ hex: fnvHex(app, str), algo: 'FNV-1a (fallback)' });
  }

  /* Fresh root per render so listeners never stack on the persistent container. */
  function mountRoot(container, html) {
    var root = document.createElement('div');
    root.className = 'surface-root';
    root.innerHTML = html;
    container.innerHTML = '';
    container.appendChild(root);
    return root;
  }

  function deck(app) { return app.arr(app.data.oracleDeck); }
  function findCard(app, id) { return deck(app).filter(function (c) { return c.id === id; })[0] || null; }

  function pullCard(app) {
    var s = app.state;
    var q = (s.intention || '').trim();
    var cards = deck(app);
    if (!q) { app.showToast('Set an intention or question first — the pull is shaped by it.'); var i = document.getElementById('gr-intention'); if (i) i.focus(); return; }
    if (!cards.length) { app.showToast('The Garden of Iris deck has not loaded.'); return; }
    if (pulling) return;
    pulling = true;
    var salt = s.salt;
    hashHex(app, q + '|' + salt).then(function (r) {
      pulling = false;
      var idx = parseInt(r.hex.slice(0, 8), 16) % cards.length;
      var card = cards[idx];
      var tpls = app.arr(card.irisBridgeTemplates);
      var tpl = tpls.length ? tpls[parseInt(r.hex.slice(8, 10), 16) % tpls.length]
        : 'Holding "{query}" beside {title}: what is this card asking you to notice today?';
      var synthesis = String(tpl).replace(/\{query\}/g, q).replace(/\{title\}/g, card.title || '');
      s.cardPull = { cardId: card.id, hashHex: r.hex, algo: r.algo, query: q, salt: salt, drawnAt: app.nowTime(), irisSynthesis: synthesis, index: idx, deckSize: cards.length };
      s.cardReflection = '';
      app.audio.chime(528, 0.05);
      app.markDone('grounding');
      app.render();
    }, function () { pulling = false; });
  }

  /* ---------- meditation ---------- */
  function meds(app) { return app.arr(app.data.meditations); }
  function currentMed(app) {
    var m = app.state.meditation;
    return meds(app).filter(function (x) { return x.id === m.selectedId; })[0] || meds(app)[0] || null;
  }
  function medTotal(app) { var med = currentMed(app); return Math.max(60, Math.round(((med && med.minutes) || 3) * 60)); }
  function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  var RING_C = 2 * Math.PI * 52;

  function updateMedDom(app) {
    var m = app.state.meditation, total = medTotal(app);
    var t = document.getElementById('med-time'); if (t) t.textContent = fmtClock(m.secondsLeft);
    var ring = document.getElementById('med-ring-progress');
    if (ring) ring.setAttribute('stroke-dashoffset', (RING_C * (m.secondsLeft / total)).toFixed(2));
    var med = currentMed(app);
    if (med && med.mode === 'guided') {
      var lines = app.arr(med.transcript), cur = currentLine(app, lines.length);
      for (var i = 0; i < lines.length; i++) {
        var el = document.getElementById('med-line-' + i);
        if (el) el.classList.toggle('is-current', i === cur && (m.running || m.secondsLeft < total));
      }
    }
  }
  function currentLine(app, n) {
    if (!n) return -1;
    var m = app.state.meditation, total = medTotal(app);
    var frac = 1 - m.secondsLeft / total;
    return Math.min(n - 1, Math.floor(frac * n));
  }
  function startMeditation(app) {
    var m = app.state.meditation, med = currentMed(app);
    if (!med) return;
    if (m.completed || m.secondsLeft <= 0) { m.secondsLeft = medTotal(app); m.completed = false; }
    m.running = true;
    app.audio.chime(432, 0.07);
    if (med.mode === 'ambient') {
      if (!app.audio.startDrone('meditation', [432, 216, 648], 0.03)) app.showToast('Audio unavailable here — the timer still runs in silence.');
    }
    if (medTimer) clearInterval(medTimer);
    medTimer = setInterval(function () {
      m.secondsLeft -= 1;
      if (m.secondsLeft <= 0) { completeMeditation(app); return; }
      updateMedDom(app);
    }, 1000);
    app.render();
  }
  function pauseMeditation(app, silent) {
    var m = app.state.meditation;
    if (medTimer) { clearInterval(medTimer); medTimer = null; }
    app.audio.stop('meditation');
    if (m.running) { m.running = false; if (!silent) app.render(); }
  }
  function completeMeditation(app) {
    var m = app.state.meditation;
    if (medTimer) { clearInterval(medTimer); medTimer = null; }
    app.audio.stop('meditation');
    m.running = false; m.secondsLeft = 0; m.completed = true;
    app.audio.chime(432, 0.07);
    if (app.state.activePhase === 'grounding') app.render();
  }
  function resetMeditation(app) {
    pauseMeditation(app, true);
    var m = app.state.meditation;
    m.secondsLeft = medTotal(app); m.completed = false;
    app.render();
  }

  /* ---------- gratitude ---------- */
  function guessTopic(app, text) {
    var t = String(text).toLowerCase(), ch = app.topicChoices;
    function pick(re, word) { if (re.test(t)) { var f = ch.filter(function (c) { return c.toLowerCase().indexOf(word) !== -1; })[0]; if (f) return f; } return null; }
    return pick(/grid|battery|energy|power|solar|outage|inverter|heat/, 'energy') ||
      pick(/\bai\b|civic|summar|model|sensemak|council|data/, 'civic') ||
      pick(/seed|water|food|garden|crop|farm|soil|salmon|creek/, 'water') || ch[0] || 'Energy & Resilience';
  }
  function attributionPreviewHtml(app) {
    var f = app.state.gratitudeForm, esc = app.esc;
    var person = f.person.trim();
    return '<div class="meta-row"><span class="badge">Recorded by You, crediting <strong>' + (person ? esc(person) : '[Person]') + '</strong></span></div>' +
      '<p>' + (f.contribution.trim() ? '“' + esc(f.contribution.trim()) + '”' : '<span class="panel-sub">What they contributed…</span>') +
      (f.enabled.trim() ? ' <span aria-hidden="true">→</span> ' + esc(f.enabled.trim()) : '') + '</p>' +
      '<p class="panel-sub">Authorship stays truthful: this is your record of their contribution, never a post in their name.</p>';
  }
  function saveGratitude(app) {
    var s = app.state, f = s.gratitudeForm;
    var person = f.person.trim(), contribution = f.contribution.trim(), enabled = f.enabled.trim();
    if (!person || !contribution) { app.showToast('Add who you are thanking and what they contributed.'); return; }
    var text = 'Gratitude on record: ' + person + ' — ' + contribution + '.' + (enabled ? ' It enabled: ' + enabled + '.' : '');
    s.gratitudeSaved.push({ person: person, contribution: contribution, enabled: enabled, savedAt: app.nowTime() });
    s.gratitudeForm = { person: '', contribution: '', enabled: '' };
    var th = app.publishThought({ type: 'reflection', text: text, creditedPerson: person, privacy: 'community', verity: 0.86, valence: 0.74, topic: guessTopic(app, contribution + ' ' + enabled), sourceSurface: 'grounding' });
    if (th) s.gratitudeSaved[s.gratitudeSaved.length - 1].thoughtId = th.id;
  }

  /* ---------- Surface 1 render ---------- */
  function renderGrounding(container, app) {
    ensureLeaveHook(app);
    var s = app.state, esc = app.esc, pull = s.cardPull, card = pull ? findCard(app, pull.cardId) : null;
    var m = s.meditation, med = currentMed(app), total = medTotal(app);
    if (!m.running && !m.completed && m.secondsLeft > total) m.secondsLeft = total;

    var cardHtml;
    var pullKey = pull ? (pull.cardId + '|' + pull.hashHex) : null;
    var isSettled = !!(pullKey && settledPullKey === pullKey);
    if (card) {
      cardHtml = '<div class="oracle-card is-drawn' + (isSettled ? ' is-settled' : '') + '">' +
        '<div class="oracle-card-art">' + (card.artSvg || '') + '</div>' +
        '<div class="meta-row"><span class="chip mono">' + esc(card.number) + '</span><span class="chip">' + esc(card.suit) + '</span></div>' +
        '<h3 class="panel-title">' + esc(card.title) + '</h3>' +
        (card.theme ? '<p class="panel-sub">' + esc(card.theme) + '</p>' : '') +
        '<div class="meta-row">' + app.arr(card.keywords).map(function (k) { return '<span class="pill">' + esc(k) + '</span>'; }).join('') + '</div>' +
        '<p>' + esc(card.description) + '</p>' +
        '<p class="oracle-prompt"><em>' + esc(card.reflectionPrompt) + '</em></p>' +
        '</div>';
      settledPullKey = pullKey;
    } else {
      cardHtml = '<div class="oracle-card is-back" aria-label="Card face down">' +
        '<div class="oracle-card-art oracle-card-back"><svg viewBox="0 0 240 320" role="img" aria-label="Garden of Iris card back"><rect x="8" y="8" width="224" height="304" rx="18" fill="none" stroke="currentColor" stroke-opacity=".5"/>' +
        '<circle cx="120" cy="160" r="54" fill="none" stroke="currentColor" stroke-opacity=".45"/><circle cx="120" cy="160" r="30" fill="none" stroke="currentColor" stroke-opacity=".35"/>' +
        '<path d="M120 96v128M56 160h128M75 115l90 90M165 115l-90 90" stroke="currentColor" stroke-opacity=".25"/></svg></div>' +
        '<p class="panel-sub">Face down. Your intention and today’s shuffle seed choose the card — no feed, no algorithmic nudge.</p></div>';
    }

    var receipt = pull ? '<div class="oracle-hash-receipt mono">' +
      '<div>Hash draw · ' + esc(pull.algo) + '(your words + seed)</div>' +
      '<div title="' + esc(pull.hashHex) + '">' + esc(pull.hashHex.slice(0, 16)) + '…' + esc(pull.hashHex.slice(-8)) + '</div>' +
      '<div>seed ' + esc(pull.salt) + ' · drawn ' + esc(pull.drawnAt) + '</div>' +
      '<div>card ' + (pull.index + 1) + ' of ' + pull.deckSize + ' · repeatable for the same words &amp; seed</div></div>' : '';
    var bridge = pull ? '<div class="iris-bridge-box"><div class="panel-sub">Iris · bridge from your intention</div><p>' + esc(pull.irisSynthesis) + '</p></div>' +
      '<label class="panel-sub" for="gr-card-reflection">Your reflection on the card</label>' +
      '<textarea id="gr-card-reflection" rows="3" placeholder="' + esc(card ? card.reflectionPrompt : '') + '">' + esc(s.cardReflection) + '</textarea>' +
      '<div class="meta-row"><button type="button" class="btn btn-primary" data-gr="card-draft">Send reflection → FourThought draft</button></div>' : '';

    var medOptions = meds(app).map(function (x) {
      return '<button type="button" class="pill-btn' + (med && x.id === med.id ? ' is-active' : '') + '" data-med-select="' + esc(x.id) + '"' + (m.running ? ' disabled' : '') + '>' +
        esc(x.title) + ' <span class="mono">' + esc(x.minutes) + 'm</span></button>';
    }).join('');
    var transcript = '';
    if (med && med.mode === 'guided') {
      var lines = app.arr(med.transcript), cur = currentLine(app, lines.length);
      transcript = '<ol class="med-transcript">' + lines.map(function (l, i) {
        return '<li id="med-line-' + i + '" class="' + (i === cur && (m.running || m.secondsLeft < total) ? 'is-current' : '') + '">' + esc(l) + '</li>';
      }).join('') + '</ol><p class="panel-sub">Transcript paces with the timer · voice by a community member.</p>';
    }
    var medReflect = m.completed ? '<div class="divider"></div><label class="panel-sub" for="med-reflection">What surfaced? (optional)</label>' +
      '<textarea id="med-reflection" rows="3" placeholder="One line is plenty.">' + esc(m.reflectionText) + '</textarea>' +
      '<div class="meta-row"><button type="button" class="btn btn-primary" data-med="draft">Save reflection → FourThought draft</button></div>' : '';

    var gratPills = app.arr(app.data.gratitudePrompts).map(function (g, i) {
      return '<button type="button" class="pill-btn" data-grat-fill="' + i + '">Example: ' + esc(g.person) + '</button>';
    }).join('');
    var gf = s.gratitudeForm;
    var saved = s.gratitudeSaved.slice().reverse().map(function (g) {
      return '<li><span class="badge">Recorded by You, crediting ' + esc(g.person) + '</span> ' + esc(g.contribution) +
        (g.thoughtId ? ' <button type="button" class="btn btn-sm btn-ghost" data-grat-view="' + esc(g.thoughtId) + '">See in FourThought →</button>' : '') + '</li>';
    }).join('');

      '<div class="grid-2 grounding-top">' +
        '<section class="panel">' +
          '<h2 class="panel-title">Set an intention</h2>' +
          '<p class="panel-sub">Write a question or intention for today. Your exact words and today’s shuffle seed work together to choose a card.</p>' +

            '<span class="panel-sub">Sample ' + deck(app).length + '-card deck · ready for the 78-card Mind Gardening Oracle</span></div>' +
          receipt +
        '</section>' +
        '<section class="panel oracle-stage" aria-live="polite">' +
          '<div class="oracle-card-wrap">' + cardHtml + '</div>' + bridge +
        '</section>' +
      '</div>' +
      '<div class="grid-2 grounding-bottom">' +
        '<section class="panel meditation-timer">' +
          '<h2 class="panel-title">Listening moment</h2>' +
          '<div class="meta-row">' + medOptions + '</div>' +
          (med ? '<p class="panel-sub">' + esc(med.guide) + ' — ' + esc(med.description) + '</p>' : '') +
          '<div class="timer-ring" role="timer" aria-label="Meditation timer">' +
            '<svg viewBox="0 0 120 120" width="148" height="148" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface-sunken)" stroke-width="7"/>' +

          '<div class="meta-row">' +
