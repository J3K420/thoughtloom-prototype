            '<button type="button" class="btn btn-ghost" data-med="reset">Reset</button>' +
            (!m.completed ? '<button type="button" class="btn btn-sm btn-ghost" data-med="finish" title="Jump straight to the closing chime">End sit now</button>' : '') +
          '</div>' +
          (med && med.mode === 'ambient' ? '<p class="panel-sub">Soft 432 Hz harmonic tone · stops automatically when you pause or move on.</p>' : '') +
          (med && med.mode === 'silence' ? '<p class="panel-sub">Single warm chime at start and end. Nothing else.</p>' : '') +
          transcript + (m.completed ? '<p class="panel-sub">Complete. No streaks, nothing to keep up — just notice what is here.</p>' : '') + medReflect +
        '</section>' +
        '<section class="panel gratitude-form">' +
          '<h2 class="panel-title">Gratitude on record</h2>' +
          '<p class="panel-sub">Put someone else’s helpful work on record — even if they never logged it themselves — so later ideas and Ŧrust can branch from it.</p>' +
          '<div class="meta-row">' + gratPills + '</div>' +
          '<label class="panel-sub" for="gr-person">Who</label><input id="gr-person" type="text" autocomplete="off" value="' + esc(gf.person) + '" placeholder="Person or group">' +
          '<label class="panel-sub" for="gr-contribution">What they contributed</label><input id="gr-contribution" type="text" autocomplete="off" value="' + esc(gf.contribution) + '" placeholder="Shared, built, maintained…">' +
          '<label class="panel-sub" for="gr-enabled">What it enabled</label><input id="gr-enabled" type="text" autocomplete="off" value="' + esc(gf.enabled) + '" placeholder="What became possible because of it">' +
          '<div class="attribution-preview" id="gr-preview" aria-live="polite">' + attributionPreviewHtml(app) + '</div>' +
          '<div class="meta-row"><button type="button" class="btn btn-primary" data-grat="save">Record gratitude → FourThought</button><span class="panel-sub">Community Ledger · editable later</span></div>' +
          (saved ? '<ul class="gratitude-saved">' + saved + '</ul>' : '') +
        '</section>' +
      '</div>');

    /* bind */
    var q = function (sel) { return root.querySelector(sel); };
    var intent = q('#gr-intention');
    intent.addEventListener('input', function () { s.intention = intent.value; });
    intent.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); pullCard(app); } });
    var cr = q('#gr-card-reflection');
    if (cr) cr.addEventListener('input', function () { s.cardReflection = cr.value; });
    var mr = q('#med-reflection');
    if (mr) mr.addEventListener('input', function () { m.reflectionText = mr.value; });
    ['person', 'contribution', 'enabled'].forEach(function (k) {
      var el = q('#gr-' + k);
      el.addEventListener('input', function () { s.gratitudeForm[k] = el.value; var p = document.getElementById('gr-preview'); if (p) p.innerHTML = attributionPreviewHtml(app); });
    });

    root.addEventListener('click', function handler(e) {
      var b = e.target.closest('button'); if (!b || b.disabled) return;
      var a;
      if ((a = b.getAttribute('data-gr'))) {
        if (a === 'pull') pullCard(app);
        else if (a === 'reshuffle') { s.salt = app.newSalt(); var el = document.getElementById('gr-salt'); if (el) el.textContent = s.salt; app.showToast('Entropy re-shuffled. Same intention, a fresh draw.'); }
        else if (a === 'card-draft' && pull && card) {
          var txt = (s.cardReflection || '').trim() || ('Pulled ' + card.title + ' for “' + pull.query + '”. ' + (card.reflectionPrompt || ''));
          app.addDraft({ text: txt, type: 'reflection', sourceSurface: 'grounding', sourceLabel: 'Garden of Iris · ' + (card.number || '') + ' ' + card.title, verity: 0.6, valence: 0.3, privacy: 'private' });
        }
      } else if ((a = b.getAttribute('data-med-select'))) {
        if (m.running) return;
        m.selectedId = a; m.completed = false; m.secondsLeft = medTotal(app); app.render();
      } else if ((a = b.getAttribute('data-med'))) {
        if (a === 'toggle') { if (m.running) pauseMeditation(app); else startMeditation(app); }
        else if (a === 'reset') resetMeditation(app);
        else if (a === 'finish') completeMeditation(app);
        else if (a === 'draft') {
          var mtxt = (m.reflectionText || '').trim() || ('After ' + (med ? med.title : 'a quiet sit') + ': noticing what settled and what is still open.');
          app.addDraft({ text: mtxt, type: 'reflection', sourceSurface: 'grounding', sourceLabel: 'Listening moment · ' + (med ? med.title : ''), verity: 0.6, valence: 0.35, privacy: 'private' });
        }
      } else if ((a = b.getAttribute('data-grat-fill')) !== null) {
        var g = app.arr(app.data.gratitudePrompts)[Number(a)];
        if (g) { s.gratitudeForm = { person: g.person || '', contribution: g.contribution || '', enabled: g.enabled || '' }; app.render(); }
      } else if (b.getAttribute('data-grat') === 'save') saveGratitude(app);
      else if ((a = b.getAttribute('data-grat-view'))) { s.selectedThoughtId = a; app.setPhase('fourthought'); }
    });
    if (m.running) updateMedDom(app);
  }

  /* =================== Surface 2: Whether Report =================== */
  var RECENCY_WEIGHT = { '1h': 1, '24h': 0.85, week: 0.6 };
  var RECENCY_ORDER = { '1h': 0, '24h': 1, week: 2 };
  var RECENCY_OPTS = [['all', 'All'], ['1h', 'Past hour'], ['24h', '24 hours'], ['week', 'Week']];

  function inScope(item, scope) { return !item || !item.scope || item.scope === 'both' || item.scope === scope; }
  function inRecency(topic, rec) {
    if (rec === 'all') return true;
    var b = RECENCY_ORDER[topic.recencyBucket]; if (b === undefined) b = 2;
    return b <= RECENCY_ORDER[rec];
  }
  function rankScore(t) { return (Number(t.uncertaintyScore) || 0) * (RECENCY_WEIGHT[t.recencyBucket] || 0.6); }
  function visibleTopics(app) {
    var s = app.state, wh = app.data.whether || {};
    return app.arr(wh.topics).filter(function (t) { return inScope(t, s.whetherScope) && inRecency(t, s.whetherRecency); })
      .sort(function (a, b) { return rankScore(b) - rankScore(a); });
  }
  function briefing(app) { return app.arr((app.data.whether || {}).breakfastBriefing); }

  function queuePiece(app, pieceId, slotId) {
    var s = app.state; slotId = slotId || 'commute-am';
    var piece = app.findPiece(pieceId);
    if (!piece) { app.showToast('No longform piece from that speaker in today’s sample.'); return; }
    if (!s.playlists[slotId]) s.playlists[slotId] = [];
    var slot = app.arr((app.data.speakers || {}).timeSlots).filter(function (x) { return x.id === slotId; })[0];
    var label = slot ? slot.label : 'Morning Commute';
    if (s.playlists[slotId].indexOf(pieceId) === -1) s.playlists[slotId].push(pieceId);
    app.showToast('Queued “' + piece.title + '” for ' + label + '.', 'Open Speakers in Focus', function () { s.activeSlotId = slotId; app.setPhase('speakers'); });
    app.render();
  }
  function speakerPiece(app, topic) {
    var ids = app.arr(topic && topic.linkedSpeakerIds);
    for (var i = 0; i < ids.length; i++) { var p = app.pieceForSpeaker(ids[i]); if (p) return p; }
    return null;
  }

  // Generation counter: speech.cancel() fires the old utterance's end/error callback
  // asynchronously, so every callback and timer checks it is still the current run.
  var bfGen = 0;
  function stopBriefing(app, silent) {
    bfGen += 1;
    if (bfTimer) { clearTimeout(bfTimer); bfTimer = null; }
    app.speech.cancel();
    if (app.state.breakfastPlaying) { app.state.breakfastPlaying = false; if (!silent) app.render(); }
  }
  function scheduleBriefing(app) {
    var s = app.state, lines = briefing(app);
    var gen = (bfGen += 1);
    if (bfTimer) { clearTimeout(bfTimer); bfTimer = null; }
    if (!s.breakfastPlaying) return;
    var line = lines[s.breakfastStep];
    function advance() {
      if (gen !== bfGen) return;
      bfTimer = null;
      if (!s.breakfastPlaying) return;
      if (s.breakfastStep >= lines.length - 1) { s.breakfastPlaying = false; app.render(); return; }
      s.breakfastStep += 1;
      app.render();
      scheduleBriefing(app);
    }
    if (s.breakfastVoice && app.speech.available() && line && line.speaker === 'iris') {
      var spoke = false;
      app.speech.speak(line.text, function () { if (!spoke && gen === bfGen) { spoke = true; bfTimer = setTimeout(advance, 500); } });
    } else {
      var words = line ? String(line.text).split(/\s+/).length : 10;
      bfTimer = setTimeout(advance, Math.min(7000, 1600 + words * 110));
    }
  }
  function askIris(app, question) {
    var s = app.state, wh = app.data.whether || {};
    var topics = app.arr(wh.topics);
    if (!topics.length) return;
    var words = String(question).toLowerCase().split(/[^a-z0-9]+/).filter(function (w) { return w.length > 3; });
    var best = null, bestScore = -1;
    topics.forEach(function (t, i) {
      var hay = [t.title, t.category, t.question, t.statement, t.reflection].join(' ').toLowerCase();
      var sc = words.reduce(function (n, w) { return n + (hay.indexOf(w) !== -1 ? 1 : 0); }, 0) - i * 0.01;
      if (sc > bestScore) { bestScore = sc; best = t; }
    });
    var t = best || topics[0];
    var answers = app.arr(t.answers).slice().sort(function (a, b) { return (a.verity || 0) - (b.verity || 0); });
    var dissent = answers[0], lead = answers[answers.length - 1];
    var mv = Number(t.meanVerity) || 0.5;
    var reply = (bestScore > 0 ? 'Good question — this sits in “' + t.title + '”. ' : 'Closest thread I have is “' + t.title + '”. ') +
      'Community Verity is ' + mv.toFixed(2) + ' (' + app.ui.verityWord(mv).toLowerCase() + '). ' +
      (lead ? lead.speaker + ' leans in: “' + lead.text + '” ' : '') +
      (dissent && dissent !== lead ? 'The live dissent is ' + dissent.speaker + ': “' + dissent.text + '”' : '');
    var piece = speakerPiece(app, t);
    s.breakfastInterrupts.push({ id: app.uid('ask'), afterStep: s.breakfastStep, q: question, a: reply, topicId: t.id, pieceId: piece ? piece.id : null, speakerName: piece ? piece.speakerName : null, time: app.nowTime() });
    app.markDone('whether');
    app.render();
    if (s.breakfastVoice) app.speech.speak(reply);
  }

  function topicCardHtml(app, t, rank) {
    var s = app.state, esc = app.esc, ui = app.ui, len = s.whetherLength;
    var open = len !== '5' || s.expandedTopicId === t.id;
    var deep = len === '30';
    var ub = t.uncertaintyBreakdown || {};
    var popOpen = s.uncertaintyOpenId === t.id;
    var piece = speakerPiece(app, t);
    var room = app.findRoom(t.linkedRoomId);
    var roomOpen = room ? app.isRoomOpen(room) : false;

    var head = '<div class="meta-row"><span class="mono topic-rank">#' + rank + '</span><span class="chip">' + esc(t.category) + '</span><span class="panel-sub">' + esc(t.recency) + '</span>' +
      '<span class="mono panel-sub" title="Uncertainty weighted by recency">activity ' + rankScore(t).toFixed(2) + '</span></div>' +
      '<h3 class="panel-title">' + esc(t.title) + '</h3>' +
      '<div class="meta-row">' +
        '<button type="button" class="uncertainty-pill" data-unc="' + esc(t.id) + '" aria-expanded="' + popOpen + '" aria-controls="unc-' + esc(t.id) + '">Uncertainty <span class="mono">' + (Number(t.uncertaintyScore) || 0).toFixed(2) + '</span> <span aria-hidden="true">?</span></button>' +
        '<span class="panel-sub">Community pulse</span>' + ui.axisPair(t.meanVerity, t.meanValence) +
      '</div>' +
      '<div class="uncertainty-popover" id="unc-' + esc(t.id) + '"' + (popOpen ? '' : ' hidden') + ' role="note">' +
        '<p><strong>Why this is near the top.</strong> ' + esc(ub.plainEnglish || 'Active disagreement weighted by how recently people updated their stakes.') + '</p>' +
        '<dl class="unc-dl"><dt>Spread</dt><dd>' + esc(ub.spread || '—') + '</dd><dt>Recent movement</dt><dd>' + esc(ub.velocity || '—') + '</dd><dt>Resampling</dt><dd>' + esc(ub.resampling || '—') + '</dd>' +
        '<dt>Activity score</dt><dd class="mono">uncertainty × recency = ' + rankScore(t).toFixed(2) + '</dd></dl>' +
        '<p class="panel-sub">Verity stays a truth estimate (0 false · 1 true). Valence — good or harmful — is tracked separately and never mixed into this score.</p></div>';

    var body = '';
    if (open) {
      var answers = app.arr(t.answers);
      // 15-min brief leads with the best-calibrated answers; Deep dive adds every dissent.
      var shownAnswers = deep ? answers : answers.slice().sort(function (a, b) { return (b.verity || 0) - (a.verity || 0); }).slice(0, 2);
      var ansHtml = shownAnswers.map(function (a) {
        var ap = app.pieceForSpeakerName(a.speaker);
        return '<li class="answer-row"><div class="meta-row"><strong class="speaker-' + esc(a.speakerHue || 'violet') + ' hue-' + esc(a.speakerHue || 'violet') + '">' + esc(a.speaker) + '</strong>' + ui.axisPair(a.verity, a.valence) +
          (deep && Number(a.verity) < 0.5 ? '<span class="chip">Dissent</span>' : '') +
          (deep && ap ? '<button type="button" class="btn btn-sm btn-ghost" data-wh-piece="' + esc(ap.id) + '">Hear ' + esc(a.speaker) + '</button>' : '') +
          '</div><p>' + esc(a.text) + '</p></li>';
      }).join('');
      if (!deep && answers.length > 2) ansHtml += '<li class="panel-sub">+' + (answers.length - 2) + ' more answers in Deep dive</li>';
      var horizon = function (obj, isPred) {
        obj = obj || {};
        return '<div class="horizon-grid">' + [['now', 'Now', 'today · this week'], ['near', 'Near', 'this month · season'], ['next', 'Next', '1–10+ years']].map(function (h) {
          var items = app.arr(obj[h[0]]);
          return '<div class="horizon-col"><div class="panel-sub"><strong>' + h[1] + '</strong> · ' + h[2] + '</div>' +
            items.map(function (it) {
              if (isPred) return '<div class="horizon-item"><p>' + esc(it.text) + '</p>' + ui.axisPair(it.verity, it.valence) +
                '<button type="button" class="btn btn-sm btn-ghost" data-wh-stake="' + esc(t.id) + '|' + h[0] + '|' + esc(it.text) + '">Stake my estimate → draft</button></div>';
              return '<div class="horizon-item"><p>' + esc(it) + '</p></div>';
            }).join('') + (items.length ? '' : '<p class="panel-sub">—</p>') + '</div>';
        }).join('') + '</div>';
      };
      var roots = app.arr(t.roots).map(function (r) {
        return '<div class="root-item"><div class="meta-row"><strong>' + esc(r.person) + '</strong><span class="mono">' + esc(r.date) + '</span>' + (deep && r.trustTag ? '<span class="chip">' + esc(r.trustTag) + '</span>' : '') + '</div>' +
          '<p>' + esc(r.summary) + '</p>' + (r.recordedBy ? '<p class="panel-sub">' + esc(r.recordedBy) + '</p>' : '') + '</div>';
      }).join('');
      body = '<div class="ft-arc">' +
        '<div class="arc-step"><span class="chip chip-question">Question · Inquiry</span><p>' + esc(t.question) + '</p></div>' +
        '<div class="arc-step"><span class="chip chip-reflection">Reflection · Past</span><p>' + esc(t.reflection) + '</p></div>' +
        '<div class="arc-step"><span class="chip chip-statement">Statement · Present</span><p>' + esc(t.statement) + '</p></div>' +
        '<div class="arc-step"><span class="chip">Answers</span><ul class="answer-list">' + ansHtml + '</ul></div>' +
        '<div class="arc-step"><span class="chip chip-prediction">Predictions · Future</span>' + horizon(t.predictions, true) + '</div>' +
        '<div class="arc-step"><span class="chip">Actions</span>' + horizon(t.actions, false) + '</div>' +
        (roots && deep ? '<div class="roots-strip"><div class="panel-sub">Roots · enabled by</div>' + roots + '</div>' : '') +
        (roots && !deep ? '<div class="roots-strip is-collapsed"><span class="panel-sub">Roots · enabled by ' + app.arr(t.roots).map(function (r) { return esc(r.person); }).join(', ') + ' — full attribution in Deep dive</span></div>' : '') +
        '</div>';
    } else {
      body = '<p>' + esc(t.question) + '</p><p class="panel-sub">' + esc(t.statement) + '</p>';
    }
    var actions = '<div class="meta-row topic-actions">' +
      (len === '5' ? '<button type="button" class="btn btn-sm btn-ghost" data-wh-expand="' + esc(t.id) + '">' + (open ? 'Collapse arc' : 'Open full arc') + '</button>' : '') +
      (piece ? '<button type="button" class="btn btn-sm btn-iris" data-wh-piece="' + esc(piece.id) + '">Speakers in Focus → ' + esc(piece.speakerName) + '</button>' : '') +
      (room ? '<button type="button" class="btn btn-sm btn-ghost" data-wh-room="' + esc(room.id) + '">Connec.to.me table' + (roomOpen ? '' : ' · opens after review') + ' →</button>' : '') +
      '<button type="button" class="btn btn-sm btn-ghost" data-wh-ask="' + esc(t.id) + '">Ask a question → draft</button>' +
      '</div>';
    return '<article class="topic-card panel" id="topic-' + esc(t.id) + '">' + head + body + actions + '</article>';
  }

  function renderWhether(container, app) {
    ensureLeaveHook(app);
    var s = app.state, esc = app.esc, ui = app.ui, wh = app.data.whether || {};
    var lines = briefing(app);
    if (s.breakfastStep > lines.length - 1) s.breakfastStep = Math.max(0, lines.length - 1);
    var len = s.whetherLength;

    var scopes = app.arr(wh.scopes).map(function (x) {
      return '<button type="button" class="pill-btn' + (s.whetherScope === x.id ? ' is-active' : '') + '" data-wh-scope="' + esc(x.id) + '" aria-pressed="' + (s.whetherScope === x.id) + '">' + esc(x.label) + ' <span class="panel-sub">' + esc(x.sub) + '</span></button>';
    }).join('');
    var lengths = app.arr(wh.lengths).map(function (x) {
      return '<button type="button" class="pill-btn' + (len === x.id ? ' is-active' : '') + '" data-wh-len="' + esc(x.id) + '" title="' + esc(x.desc) + '" aria-pressed="' + (len === x.id) + '">' + esc(x.label) + '</button>';
    }).join('');
    var curLen = app.arr(wh.lengths).filter(function (x) { return x.id === len; })[0];
    var recency = RECENCY_OPTS.map(function (r) {
      return '<button type="button" class="pill-btn' + (s.whetherRecency === r[0] ? ' is-active' : '') + '" data-wh-rec="' + r[0] + '" aria-pressed="' + (s.whetherRecency === r[0]) + '">' + r[1] + '</button>';
    }).join('');

    var switches = app.arr(wh.breakingSwitches).filter(function (sw) { return inScope(sw, s.whetherScope); });
    var swHtml = switches.map(function (sw) {
      var vAfter = Number(sw.verityAfter) || 0;
      var delta = vAfter - (Number(sw.verityBefore) || 0);
      var vCls = vAfter > 0.52 ? ' is-true' : (vAfter < 0.48 ? ' is-false' : '');
      return '<div class="switch-item"><div class="meta-row"><span class="mono">' + esc(sw.timeAgo) + '</span>' +
        '<span class="badge badge-verity' + vCls + ' mono">Verity ' + (Number(sw.verityBefore) || 0).toFixed(2) + ' → ' + vAfter.toFixed(2) + ' (' + (delta >= 0 ? '+' : '') + delta.toFixed(2) + ')</span></div>' +
        '<div class="meta-row switch-rails">' + ui.miniRail(sw.verityBefore, 'verity', false) + '<span aria-hidden="true">→</span>' + ui.miniRail(sw.verityAfter, 'verity', false) + '</div>' +
        '<p>' + esc(sw.summary) + '</p>' +
        ('<div class="meta-row"><span class="panel-sub">Resampled:</span>' + app.arr(sw.resampledSpeakers).map(function (n) {
          var p = app.pieceForSpeakerName(n);
          return '<button type="button" class="chip chip-btn" data-wh-speaker="' + esc(n) + '"' + (p ? ' data-wh-piece="' + esc(p.id) + '"' : '') + '>' + esc(n) + (p ? ' →' : '') + '</button>';
        }).join('') + (sw.topicId ? '<button type="button" class="btn btn-sm btn-ghost" data-wh-topic="' + esc(sw.topicId) + '">Open topic</button>' : '') + '</div>') +
        '</div>';
    }).join('') || '<p class="panel-sub">No switches in this scope right now.</p>';

    // breakfast feed
    var feed = [];
    for (var i = 0; i <= s.breakfastStep && i < lines.length; i++) {
      var l = lines[i];
      feed.push('<div class="dialogue-bubble ' + (l.speaker === 'iris' ? 'is-iris' : 'is-you') + (i === s.breakfastStep && s.breakfastPlaying ? ' is-current' : '') + '">' +
        '<div class="meta-row"><strong>' + (l.speaker === 'iris' ? 'Iris' : 'You') + '</strong><span class="mono">' + esc(l.time) + '</span></div><p>' + esc(l.text) + '</p></div>');
      s.breakfastInterrupts.forEach(function (it) {
        if (it.afterStep !== i) return;
        feed.push('<div class="dialogue-bubble is-you"><div class="meta-row"><strong>You · mid-briefing</strong><span class="mono">' + esc(it.time) + '</span></div><p>' + esc(it.q) + '</p></div>');
        feed.push('<div class="dialogue-bubble is-iris"><div class="meta-row"><strong>Iris</strong></div><p>' + esc(it.a) + '</p>' +
          (it.pieceId ? '<div class="meta-row"><button type="button" class="btn btn-sm btn-iris" data-wh-queue="' + esc(it.pieceId) + '">Queue ' + esc(it.speakerName) + ' for Commute</button></div>' : '') + '</div>');
      });
    }
    var atEnd = s.breakfastStep >= lines.length - 1;
    var headTopic = visibleTopics(app)[0] || app.arr(wh.topics)[0];
    var headPiece = headTopic ? speakerPiece(app, headTopic) : null;
    var voiceOk = app.speech.available();

    var topics = visibleTopics(app);
    var topicsHtml = topics.map(function (t, i) { return topicCardHtml(app, t, i + 1); }).join('') ||
      '<div class="panel"><p class="panel-sub">Nothing moved in that window for this scope. Try a wider recency filter.</p></div>';

    var root = mountRoot(container,
      '<div class="whether-toolbar panel-sunken" role="toolbar" aria-label="Whether Report settings">' +
        '<div class="toolbar-group"><span class="panel-sub">Scope</span>' + scopes + '</div>' +
        '<div class="toolbar-group"><span class="panel-sub">Recap length</span>' + lengths + '</div>' +
        '<div class="toolbar-group"><span class="panel-sub">Recency</span>' + recency + '</div>' +
        (curLen ? '<div class="panel-sub toolbar-note">' + esc(curLen.desc) + '</div>' : '') +
      '</div>' +
      '<section class="panel breaking-strip" aria-label="What shifted overnight">' +
        '<div><h2 class="panel-title">What shifted overnight</h2><p class="panel-sub">Recent belief switches &amp; newly sampled voices</p></div>' + swHtml +
      '</section>' +
      '<section class="panel breakfast-player" aria-label="Listen with Iris while making breakfast">' +
        '<div class="meta-row"><h2 class="panel-title">Listen with Iris while making breakfast</h2></div>' +
        '<div class="meta-row">' +
          '<button type="button" class="btn ' + (s.breakfastPlaying ? 'btn-ghost' : 'btn-primary') + '" data-bf="toggle">' + (s.breakfastPlaying ? '❚❚ Pause' : (atEnd && s.breakfastStep > 0 ? '↻ Replay' : '▶ Play briefing')) + '</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-bf="next"' + (atEnd ? ' disabled' : '') + '>Next line</button>' +
          '<label class="pill-btn' + (s.breakfastVoice ? ' is-active' : '') + '"><input type="checkbox" id="bf-voice"' + (s.breakfastVoice ? ' checked' : '') + (voiceOk ? '' : ' disabled') + '> Iris voice</label>' +
          (voiceOk ? '' : '<span class="panel-sub">Voice unavailable in this browser — reading mode.</span>') +
          '<span class="mono panel-sub">' + (Math.min(s.breakfastStep + 1, lines.length)) + ' / ' + lines.length + '</span>' +
        '</div>' +
        '<div class="dialogue-feed" aria-live="polite">' + feed.join('') + '</div>' +
        '<div class="meta-row bf-ask"><label class="sr-only" for="bf-ask">Ask Iris mid-briefing</label>' +
          '<input id="bf-ask" type="text" autocomplete="off" placeholder="Ask Iris mid-briefing… e.g. what changed minds?" value="' + esc(bfAskText) + '">' +
          '<button type="button" class="btn btn-iris" data-bf="ask">Ask</button>' +
          (headPiece ? '<button type="button" class="btn btn-sm btn-ghost" data-wh-queue="' + esc(headPiece.id) + '">Queue ' + esc(headPiece.speakerName) + ' for Commute</button>' : '') +
        '</div>' +
      '</section>' +
      '<section class="whether-topics" aria-label="Active topics ranked by open uncertainty and recency">' +
        '<div class="meta-row"><h2 class="panel-title">Active topics · ranked by open uncertainty &amp; recency</h2><span class="panel-sub">' + topics.length + ' shown</span></div>' +
        topicsHtml +
      '</section>');

    /* bind */
    var ask = root.querySelector('#bf-ask');
    ask.addEventListener('input', function () { bfAskText = ask.value; });
    ask.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitAsk(); } });
    function submitAsk() { var v = bfAskText.trim(); if (!v) { app.showToast('Type a question for Iris.'); return; } bfAskText = ''; askIris(app, v); }
    var voice = root.querySelector('#bf-voice');
    voice.addEventListener('change', function () {
      s.breakfastVoice = voice.checked;
      if (!voice.checked) app.speech.cancel();
      else if (s.breakfastPlaying) { scheduleBriefing(app); }
      app.render();
    });

    root.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b || b.disabled) return;
      var a;
      if ((a = b.getAttribute('data-wh-scope'))) { s.whetherScope = a; app.render(); }
      else if ((a = b.getAttribute('data-wh-len'))) { s.whetherLength = a; app.render(); }
      else if ((a = b.getAttribute('data-wh-rec'))) { s.whetherRecency = a; app.render(); }
      else if ((a = b.getAttribute('data-unc'))) { s.uncertaintyOpenId = s.uncertaintyOpenId === a ? null : a; app.render(); }
      else if ((a = b.getAttribute('data-wh-expand'))) { s.expandedTopicId = s.expandedTopicId === a ? '' : a; app.render(); }
      else if ((a = b.getAttribute('data-wh-piece'))) { app.jumpToPiece(a); }
      else if ((a = b.getAttribute('data-wh-speaker'))) { app.showToast(a + ' has no longform piece in today’s sample yet.'); }
      else if ((a = b.getAttribute('data-wh-room'))) { app.jumpToRoom(a); }
      else if ((a = b.getAttribute('data-wh-queue'))) { queuePiece(app, a, 'commute-am'); }
      else if ((a = b.getAttribute('data-wh-topic'))) {
        s.expandedTopicId = a; if (s.whetherRecency !== 'all') s.whetherRecency = 'all'; app.render();
        var el = document.getElementById('topic-' + a); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      else if ((a = b.getAttribute('data-wh-ask'))) {
        var t = app.findTopic(a);
        if (t) app.addDraft({ type: 'question', text: 'Following “' + t.title + '”: ' + (t.question || ''), sourceSurface: 'whether', sourceLabel: 'Whether Report · ' + t.title, topic: t.category, verity: 0.5, valence: 0 });
      }
      else if ((a = b.getAttribute('data-wh-stake'))) {
        var parts = a.split('|'), tp = app.findTopic(parts[0]);
        app.addDraft({ type: 'prediction', text: parts.slice(2).join('|'), sourceSurface: 'whether', sourceLabel: 'Whether Report · ' + (tp ? tp.title : '') + ' · ' + parts[1], topic: tp ? tp.category : '', verity: 0.5, valence: 0 });
      }
      else if ((a = b.getAttribute('data-bf'))) {
        if (a === 'toggle') {
          if (s.breakfastPlaying) stopBriefing(app);
          else {
            if (s.breakfastStep >= lines.length - 1 && s.breakfastStep > 0) { s.breakfastStep = 0; s.breakfastInterrupts = []; }
            s.breakfastPlaying = true; app.markDone('whether'); app.render(); scheduleBriefing(app);
          }
        } else if (a === 'next') {
          app.speech.cancel();
          if (s.breakfastStep < lines.length - 1) { s.breakfastStep += 1; app.render(); if (s.breakfastPlaying) scheduleBriefing(app); }
        } else if (a === 'ask') submitAsk();
      }
    });
  }

  window.CognicistMorning = { renderGrounding: renderGrounding, renderWhether: renderWhether };
})();

</script>
<script>
/* ---- src/surfaces-day.js ---- */
/* Cognicist prototype — Surface 3 (Speakers in Focus), 4 (FourThought), 5 (Connec.to.me).
 * Exposes window.CognicistDay.renderSpeakers / renderFourThought / renderConnectome. Uses helpers only via `app`. */
(function () {
  'use strict';

  var hookSet = false;
  var playerTimer = null;
  var playerPos = {};
  var playerPlaying = null; // pieceId
  var reactDraft = '';
  var thanksText = {};
  var cxInput = '';
  var cxTimers = [];
  var speakingMsgId = null;
  var replyTurn = 0;

  function ensureLeaveHook(app) {
    if (hookSet) return;
    hookSet = true;
    app.onLeave(function () {
      hookSet = false;
      stopPlayer();
      cxTimers.forEach(clearTimeout); cxTimers = [];
      if (speakingMsgId) { app.speech.cancel(); speakingMsgId = null; }
    });
  }
  function mountRoot(container, html) {
    var root = document.createElement('div');
    root.className = 'surface-root';
    root.innerHTML = html;
    container.innerHTML = '';
    container.appendChild(root);
    return root;
  }
  function tsToSec(ts) {
    var p = String(ts || '0').split(':').map(Number), s = 0;
    for (var i = 0; i < p.length; i++) s = s * 60 + (isNaN(p[i]) ? 0 : p[i]);
    return s;
  }
  function fmtSec(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function excerpt(t, n) { t = String(t || ''); return t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : t; }

  /* =================== Surface 3: Speakers in Focus =================== */
  var FORMAT_LABEL = { 'read-listen': 'Read · Listen', audio: 'Audio', video: 'Video', art: 'Regenerative art' };

  function slots(app) { return app.arr((app.data.speakers || {}).timeSlots); }
  function slotById(app, id) { return slots(app).filter(function (s) { return s.id === id; })[0] || null; }
  function items(app) { return app.arr((app.data.speakers || {}).items); }

  function stopPlayer() { if (playerTimer) { clearInterval(playerTimer); playerTimer = null; } playerPlaying = null; }

  function slotSelectHtml(app, piece, loc) {
    var esc = app.esc, def = piece.recommendedSlot && slotById(app, piece.recommendedSlot) ? piece.recommendedSlot : app.state.activeSlotId;
    var id = 'sp-slot-' + loc + '-' + piece.id;
    return '<span class="slot-add"><label class="sr-only" for="' + esc(id) + '">Time slot for ' + esc(piece.title) + '</label>' +
      '<select id="' + esc(id) + '" data-slot-for="' + esc(piece.id) + '">' + slots(app).map(function (s) {
        return '<option value="' + esc(s.id) + '"' + (s.id === def ? ' selected' : '') + '>' + esc(s.label) + '</option>';
      }).join('') + '</select><button type="button" class="btn btn-sm btn-ghost" data-sp-add="' + esc(piece.id) + '">+ Add</button></span>';
  }
  function reviewedBadge(app, piece) {
    if (app.state.reviewedPieceIds.indexOf(piece.id) === -1) return '';
    var room = app.findRoom(piece.linkedRoomId);
    return room && app.isRoomOpen(room) ? '<span class="badge badge-unlock">Reviewed · table open</span>' : '<span class="badge">Reviewed ✓</span>';
  }
  function pieceMeta(app, p) {
    var esc = app.esc;
    return '<div class="meta-row"><strong class="speaker-' + esc(p.speakerHue || 'violet') + ' hue-' + esc(p.speakerHue || 'violet') + '">' + esc(p.speakerName) + '</strong><span class="panel-sub">' + esc(p.speakerRole || '') + '</span></div>' +
      '<div class="meta-row"><span class="chip">' + esc(FORMAT_LABEL[p.format] || p.format || '') + '</span><span class="mono">' + esc(p.durationMin) + ' min</span>' + reviewedBadge(app, p) + '</div>';
  }
  function pieceCardHtml(app, p, loc, big) {
    var esc = app.esc;
    return '<article class="' + (big ? 'speaker-headline panel-raised' : 'panel speaker-card') + '">' +
      (big ? '<div class="surface-eyebrow">Headlined today</div>' : '') +
      pieceMeta(app, p) +
      '<h3 class="panel-title">' + esc(p.title) + '</h3>' +
      '<p>' + esc(p.dek) + '</p>' +
      (big && p.provenanceNote ? '<p class="panel-sub">' + esc(p.provenanceNote) + '</p>' : '') +
      '<div class="meta-row"><button type="button" class="btn btn-sm ' + (big ? 'btn-primary' : 'btn-iris') + '" data-sp-open="' + esc(p.id) + '">' + (p.format === 'video' ? 'Watch' : p.format === 'audio' ? 'Listen' : 'Read / listen') + '</button>' +
      slotSelectHtml(app, p, loc) + '</div></article>';
  }
  function archiveRowsHtml(app) {
    var s = app.state, esc = app.esc, q = (s.archiveSearch || '').toLowerCase().trim();
    var list = items(app).filter(function (p) {
      if (p.tier !== 'archive' && !q) return false;
      if (s.archiveFormat !== 'all' && p.format !== s.archiveFormat) return false;
      if (!q) return true;
      return [p.title, p.speakerName, p.dek, p.speakerRole].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    if (!list.length) return '<li class="panel-sub">No pieces match. Try another word or format.</li>';
    return list.map(function (p) {
      return '<li class="archive-row"><div class="meta-row"><strong>' + esc(p.title) + '</strong><span class="chip">' + esc(FORMAT_LABEL[p.format] || p.format) + '</span><span class="mono">' + esc(p.durationMin) + 'm</span>' + reviewedBadge(app, p) + '</div>' +
        '<div class="panel-sub">' + esc(p.speakerName) + ' · ' + esc(excerpt(p.dek, 110)) + '</div>' +
        '<div class="meta-row"><button type="button" class="btn btn-sm btn-ghost" data-sp-open="' + esc(p.id) + '">Open</button>' + slotSelectHtml(app, p, 'ar') + '</div></li>';
    }).join('');
  }
  function playlistPanelHtml(app) {
    var s = app.state, esc = app.esc;
    var tabs = slots(app).map(function (sl) {
      var n = app.arr(s.playlists[sl.id]).length;
      return '<button type="button" class="pill-btn' + (s.activeSlotId === sl.id ? ' is-active' : '') + '" data-sp-slot="' + esc(sl.id) + '" aria-pressed="' + (s.activeSlotId === sl.id) + '">' + esc(sl.label) + ' <span class="mono">' + n + '</span></button>';
    }).join('');
    var sl = slotById(app, s.activeSlotId) || slots(app)[0] || { id: s.activeSlotId, label: 'Slot', window: '' };
    var ids = app.arr(s.playlists[sl.id]);
    var mins = 0;
    var rows = ids.map(function (id) {
      var p = app.findPiece(id); if (!p) return '';
      mins += Number(p.durationMin) || 0;
      return '<li class="playlist-row"><span class="mono">' + esc(p.durationMin) + 'm</span> <span>' + esc(p.title) + '</span> <span class="panel-sub">' + esc(p.speakerName) + '</span>' +
        '<button type="button" class="btn btn-sm btn-ghost" data-sp-open="' + esc(p.id) + '">Open</button>' +
        '<button type="button" class="btn btn-sm btn-ghost" data-sp-remove="' + esc(p.id) + '" aria-label="Remove ' + esc(p.title) + ' from ' + esc(sl.label) + '">Remove</button></li>';
    }).join('');
    return '<section class="panel playlist-panel"><h2 class="panel-title">Your day, by time slot</h2>' +
      '<div class="slot-tabs" role="tablist">' + tabs + '</div>' +
      '<div class="meta-row"><strong>' + esc(sl.label) + '</strong><span class="panel-sub">' + esc(sl.window || '') + ' · ' + esc(sl.kind || '') + '</span><span class="mono">' + mins + ' min queued</span></div>' +
      (rows ? '<ol class="playlist-list">' + rows + '</ol>' : '<p class="panel-sub">Nothing here yet. Add a piece with “+ Add”, or adopt a community playlist below.</p>') +
      '</section>';
  }
  function communityPlaylistsHtml(app) {
    var s = app.state, esc = app.esc;
    return app.arr((app.data.speakers || {}).communityPlaylists).map(function (pl) {
      var sl = slotById(app, pl.slotId);
      var resolved = app.arr(pl.itemIds).map(app.findPiece).filter(Boolean);
      var sent = !!s.playlistThanksSent[pl.id];
      var thanks = '';
      if (pl.isCloseConnection) {
        if (sent) thanks = '<span class="badge">Thank-you sent to ' + esc(pl.curator) + ' ✓</span>';
        else if (s.thanksOpenId === pl.id) {
          var def = thanksText[pl.id] !== undefined ? thanksText[pl.id] : 'Thank you for “' + pl.title + '” — it made my morning gentler.';
          thanks = '<div class="thanks-box"><label class="panel-sub" for="pl-thanks-' + esc(pl.id) + '">Direct message to ' + esc(pl.curator) + '</label>' +
            '<input id="pl-thanks-' + esc(pl.id) + '" data-thanks-for="' + esc(pl.id) + '" type="text" value="' + esc(def) + '">' +
            '<div class="meta-row"><button type="button" class="btn btn-sm btn-primary" data-pl-send="' + esc(pl.id) + '">Send thanks</button><button type="button" class="btn btn-sm btn-ghost" data-pl-thanks="' + esc(pl.id) + '">Cancel</button></div></div>';
        } else thanks = '<button type="button" class="btn btn-sm btn-ghost" data-pl-thanks="' + esc(pl.id) + '">Send ' + esc(pl.curator) + ' a thank-you</button>';
      }
      return '<article class="playlist-card panel"><div class="meta-row"><strong class="panel-title">' + esc(pl.title) + '</strong></div>' +
        '<div class="meta-row"><span class="panel-sub">Curated by ' + esc(pl.curator) + '</span>' + (pl.isCloseConnection ? '<span class="chip">Close connection</span>' : '') +
        (sl ? '<span class="chip">' + esc(sl.label) + '</span>' : '') + '<span class="mono panel-sub">' + esc(pl.valueCount || 0) + ' found it valuable</span></div>' +
        '<p>' + esc(pl.description) + '</p>' +
        (resolved.length ? '<ul class="playlist-items">' + resolved.map(function (p) { return '<li>' + esc(p.title) + ' <span class="panel-sub">· ' + esc(p.speakerName) + '</span></li>'; }).join('') + '</ul>' : '') +
        '<div class="meta-row"><button type="button" class="btn btn-sm btn-iris" data-pl-adopt="' + esc(pl.id) + '">Adopt into ' + esc(sl ? sl.label : 'my slot') + '</button>' +
        '<button type="button" class="btn btn-sm btn-ghost" data-pl-stake="' + esc(pl.id) + '">Stake a thought on its value → draft</button>' + thanks + '</div></article>';
    }).join('');
  }
  function readerHtml(app, p) {
    var s = app.state, esc = app.esc, ui = app.ui;
    var passages = app.arr(p.passages);
    var total = Math.max(60, (Number(p.durationMin) || 10) * 60);
    var pos = playerPos[p.id] || 0;
    var reviewed = s.reviewedPieceIds.indexOf(p.id) !== -1;
    var engaged = app.arr(s.engagedPassages[p.id]);
    var room = app.findRoom(p.linkedRoomId);
    var pHtml = passages.map(function (ps) {
      var sel = s.selectedPassageId === ps.id;
      var rx = app.arr(ps.reactions);
      var inner = '';
      if (sel) {
        inner = '<div class="reaction-list">' + (rx.length ? rx.map(function (r) {
          return '<div class="reaction-item"><div class="meta-row"><strong>' + esc(r.author) + '</strong>' + ui.axisPair(r.verity, r.valence) + '</div><p>' + esc(r.text) + '</p></div>';
        }).join('') : '<p class="panel-sub">No reactions yet — yours would be the first.</p>') +
          '<label class="panel-sub" for="rd-react">Your reaction (tagged to ' + esc(ps.timestamp) + ')</label>' +
          '<textarea id="rd-react" rows="2" placeholder="What does this passage change for you?">' + esc(reactDraft) + '</textarea>' +
          '<div class="meta-row"><button type="button" class="btn btn-sm btn-primary" data-rd-stake="' + esc(ps.id) + '">Stake reaction → FourThought draft</button></div></div>';
      }
      return '<div class="passage-block' + (sel ? ' is-selected' : '') + (engaged.indexOf(ps.id) !== -1 ? ' is-engaged' : '') + '" data-passage="' + esc(ps.id) + '" data-ts="' + tsToSec(ps.timestamp) + '">' +
        '<div class="meta-row"><button type="button" class="chip mono chip-btn" data-rd-seek="' + tsToSec(ps.timestamp) + '" aria-label="Jump audio to ' + esc(ps.timestamp) + '">' + esc(ps.timestamp) + '</button>' +
        '<span class="panel-sub">' + rx.length + ' reaction' + (rx.length === 1 ? '' : 's') + '</span></div>' +
        '<button type="button" class="passage-text" data-rd-select="' + esc(ps.id) + '" aria-expanded="' + sel + '">' + esc(ps.text) + '</button>' + inner + '</div>';
    }).join('');
    return '<section class="reader-panel panel-raised" aria-label="Reader and player">' +
      '<div class="meta-row reader-head"><button type="button" class="btn btn-sm btn-ghost" data-sp-close="1">← Back to today’s speakers</button></div>' +
      pieceMeta(app, p) +
      '<h2 class="panel-title">' + esc(p.title) + '</h2><p>' + esc(p.dek) + '</p>' +
      (p.provenanceNote ? '<p class="panel-sub">' + esc(p.provenanceNote) + '</p>' : '') +
      '<div class="audio-scrub meta-row"><button type="button" class="btn btn-sm btn-iris" data-rd-play="' + esc(p.id) + '">' + (playerPlaying === p.id ? '❚❚ Pause' : '▶ Play') + '</button>' +
        '<label class="sr-only" for="rd-scrub">Playback position</label><input id="rd-scrub" type="range" min="0" max="' + total + '" step="1" value="' + Math.round(pos) + '">' +
        '<span class="mono" id="rd-time">' + fmtSec(pos) + ' / ' + fmtSec(total) + '</span><span class="panel-sub">Audio preview · scrub or tap any timestamp below</span></div>' +
      (passages.length ? '<div class="passage-list">' + pHtml + '</div>' : '<p class="panel-sub">This piece has no tagged passages yet — the full text opens in the speaker’s own space.</p>') +
      '<div class="divider"></div><div class="meta-row">' +
        (reviewed ? (room && app.isRoomOpen(room)
            ? '<span class="badge badge-unlock">Reviewed ✓ · table open</span><button type="button" class="btn btn-primary btn-sm" data-sp-room="' + esc(room.id) + '">Join the “' + esc(room.title) + '” table →</button>'
            : '<span class="badge">Reviewed ✓</span>' + (room && app.findPiece(room.requiredPieceId) ? '<span class="panel-sub">The “' + esc(room.title) + '” table opens with “' + esc(app.findPiece(room.requiredPieceId).title) + '”.</span><button type="button" class="btn btn-ghost btn-sm" data-sp-open="' + esc(room.requiredPieceId) + '">Open that piece →</button>' : ''))
          : '<button type="button" class="btn btn-primary btn-sm" data-rd-review="' + esc(p.id) + '">Mark reviewed &amp; open table</button>' +
            '<span class="panel-sub">Read ' + engaged.length + ' of ' + passages.length + ' passages' + (passages.length >= 2 ? ' · tapping two opens the table automatically' : '') + '</span>') +
      '</div></section>';
  }
  function updatePlayerDom(p) {
    var total = Math.max(60, (Number(p.durationMin) || 10) * 60), pos = playerPos[p.id] || 0;
    var sc = document.getElementById('rd-scrub'); if (sc && document.activeElement !== sc) sc.value = String(Math.round(pos));
    var t = document.getElementById('rd-time'); if (t) t.textContent = fmtSec(pos) + ' / ' + fmtSec(total);
    var blocks = document.querySelectorAll('.passage-block[data-ts]'), cur = null;
    for (var i = 0; i < blocks.length; i++) if (Number(blocks[i].getAttribute('data-ts')) <= pos) cur = blocks[i];
    for (var j = 0; j < blocks.length; j++) blocks[j].classList.toggle('is-playing', blocks[j] === cur);
  }
  function engagePassage(app, p, psId) {
    var s = app.state;
    var list = s.engagedPassages[p.id] || (s.engagedPassages[p.id] = []);
    if (list.indexOf(psId) === -1) list.push(psId);
    if (list.length >= 2 && s.reviewedPieceIds.indexOf(p.id) === -1) { app.markPieceReviewed(p.id); return true; }
    return false;
  }

  function renderSpeakers(container, app) {
    ensureLeaveHook(app);
    var s = app.state, esc = app.esc, sp = app.data.speakers || {};
    var all = items(app);
    var headline = all.filter(function (p) { return p.tier === 'headline'; })[0];
    var highlighted = all.filter(function (p) { return p.tier === 'highlighted'; }).slice(0, 5);

    ':where(.mini-rail-num){font-size:.75em;margin:0 .6em 0 .35em;color:var(--text-muted)}',
    ':where(.axis-track){position:relative;height:10px;border-radius:5px;background:var(--surface-sunken,#0c1916);margin:.5rem 0}',
    ':where(.axis-track) :where(.axis-midline){position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--border-strong)}',
    ':where(.axis-track) :where(.axis-fill){position:absolute;top:0;bottom:0;border-radius:5px}',

    ':where(.toast-stack){position:fixed;right:16px;bottom:72px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}',

    ':where(.toast-msg){flex:1}',
    ':where(.reviewer-drawer){position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);overflow:auto;padding:16px;background:var(--surface);border-left:1px solid var(--border);transform:translateX(105%);transition:transform .25s ease;z-index:70}',
    ':where(.reviewer-drawer.is-open){transform:none}',
    ':where(.reviewer-drawer) :where(textarea){width:100%;box-sizing:border-box}',
    ':where(.drawer-head){display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}',
    ':where(.reviewer-note-list){list-style:none;padding:0;margin:12px 0 0}',
    ':where(.reviewer-fab){position:fixed;right:16px;bottom:16px;z-index:55}',
    ':where(.ambient-bar){position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 16px;z-index:40}',
    ':where(.ambient-text){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}',

    ':where(.ambient-eq) i{display:block;width:3px;height:4px;background:var(--iris);border-radius:1px}',
    ':where(.ambient-eq.is-playing) i{animation:cg-eq 1.4s ease-in-out infinite}',
    ':where(.ambient-eq.is-playing) i:nth-child(2){animation-delay:.2s}:where(.ambient-eq.is-playing) i:nth-child(3){animation-delay:.45s}:where(.ambient-eq.is-playing) i:nth-child(4){animation-delay:.7s}',
    '@keyframes cg-eq{0%,100%{height:4px}50%{height:14px}}',
    ':where(.wave){display:inline-flex;gap:2px;align-items:center;height:12px;margin-left:6px}',
    ':where(.wave) i{display:block;width:2px;height:3px;background:var(--iris);border-radius:1px}',

    ':where(.phase-pill:not(.is-done)) :where(.phase-check){display:none}',

    ':where(.chart-svg){width:100%;height:auto;display:block}',

    ':where(.app-shell) :where(input,textarea,select){max-width:100%;box-sizing:border-box}'
  ].join('\n');
  function injectFallbackCss() {
    var s = document.createElement('style');
    s.id = 'cg-fallback-css';
    s.textContent = FALLBACK_CSS;
    document.head.insertBefore(s, document.head.firstChild);
  }

  /* ---------- public API ---------- */
  var api = {
    state: state,
    data: D,
    phases: PHASES,
    todayIndex: TODAY_INDEX,
    typeMeta: TYPE_META,
    topicChoices: topicChoices,

    markDone: markDone,
    onLeave: onLeave,
    audio: audio,
    speech: speech,
    escapeHtml: escapeHtml,
    esc: escapeHtml,
    uid: uid,
    clamp: clamp,
    arr: arr,
    nowTime: nowTime,
    fnv1a: fnv1a,
    newSalt: randomSalt,
    findPiece: findPiece,
    findRoom: findRoom,
    findTopic: findTopic,
    findThought: findThought,
    findPhase: findPhase,
    pieceForSpeaker: pieceForSpeaker,
    pieceForSpeakerName: pieceForSpeakerName,
    isRoomOpen: isRoomOpen,
    privacyLabel: privacyLabel,
    ui: {
      miniRail: miniRail, axisPair: axisPair, axisControl: axisControl, bindAxis: bindAxis,
      verityWord: verityWord, valenceWord: valenceWord, fmtAxis: fmtAxis,
      typeBadge: typeBadge, privacyBadge: privacyBadge
    }
  };
  window.CognicistApp = api;

  function boot() {
    injectFallbackCss();
    mount();
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
