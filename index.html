<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Thoughtloom Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;family=Caveat:wght@500..700&amp;family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&amp;family=Saira:wdth,wght@50..125,100..900&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;family=JetBrains+Mono:wght@400..700&amp;display=swap">
<style>
/* The shared base (Modern is the base layer): tokens, type, the answer line, buttons, sheets.
   The page skeleton (top row, Say it, Browse, rows) is in layout.css. */
:root{
  --ground:#EDF1F5; --surface:#FFFFFF; --ink:#17203A; --ink2:#56607A; --line:#C9D1DC; --tile:#F2F5F8;
  --gold:#F2B824; --gold-deep:#A87F00; --on-gold:#17203A;
  --red:#8E2B36; --on-red:#FFFFFF;
  --green:#5BC49A; --green-deep:#24795A; --on-green:#17203A;
  --coral:#EB8068; --coral-deep:#C9553F; --on-coral:#17203A;
  --violet:#6A55C2; --on-violet:#FFFFFF; --violet-soft:#E4DFF7;
  --btn:#17203A; --on-btn:#FFFFFF;
  --shadow:0 12px 32px rgba(23,32,58,.14);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* One look on purpose: the bright one is the design being judged, so it does not follow a dark setting. */
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
p,h1,h2{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:500}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* page frame: the skeleton is in layout.css */
.stage{height:100%;display:flex;flex-direction:column;background:var(--ground)}
.app{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;background:var(--ground);overflow:hidden}

/* app chrome */
.demo{flex:none;padding-block:6px 0;text-align:center;font-size:12.5px;color:var(--ink2)}
.top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px 10px}
.mark{font-size:21px;font-weight:750;letter-spacing:-.01em;line-height:1.1}
.net{font-size:12.5px;color:var(--ink2)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:6px 28px;display:flex;flex-direction:column;gap:22px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tab{min-height:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--ink2)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.toast{position:absolute;left:16px;right:16px;bottom:74px;z-index:9;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast span{background:var(--btn);color:var(--on-btn);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600}

/* text */
.hello{font-size:31px;line-height:1.05;font-weight:750;letter-spacing:-.015em}
.lede{font-size:17px;margin-top:8px;max-width:34em}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:20px;font-weight:700;letter-spacing:-.005em}
.say{font-size:25px;line-height:1.14;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.say.big{font-size:30px}
.say.sm{font-size:19px;line-height:1.2;font-weight:600}
.q{font-size:17px;font-weight:650;margin-top:2px}
.hint,.after,.fine{font-size:14.5px;color:var(--ink2)}

/* people */
.tok{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:13px;font-weight:700;line-height:1;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.tok.you{background:var(--ink);color:var(--surface)}
.by{display:flex;align-items:center;gap:8px;font-size:15px}
.by b{font-weight:650}
.by span:last-child{color:var(--ink2)}

/* cards and rows */
.card{background:var(--surface);border-radius:24px;padding:18px 16px;display:flex;flex-direction:column;gap:13px}
.card.hero{box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;background:var(--tile);border-radius:10px;padding:6px 10px}
.chip.solid{background:var(--btn);color:var(--on-btn)}
.irisline{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink2)}
.iris{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.iris i{font-size:13px;font-weight:600;line-height:1}

/* the answer line */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--tile);padding:4px 1px;font-size:15px;font-weight:650;font-stretch:78%;line-height:1.1}
.tiles.three .tile{font-stretch:100%;min-height:50px}
.tile.on.t{background:var(--gold);color:var(--on-gold);border-color:var(--ink)}
.tile.on.f{background:var(--red);color:var(--on-red);border-color:var(--red)}
.tile.on.n{background:var(--surface);border:2.5px solid var(--ink)}
.tile.on.g{background:var(--green);color:var(--on-green);border-color:var(--ink)}
.tile.on.c{background:var(--coral);color:var(--on-coral);border-color:var(--ink)}
.pins{position:relative;height:30px;margin-top:8px}
.pin{position:absolute;bottom:0;width:26px;height:26px;margin-left:-13px;font-size:12px}
.rail{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:10px}
.pins + .rail{margin-top:5px}
.mid{position:absolute;left:50%;top:-5px;width:2px;height:18px;margin-left:-1px;background:var(--ink)}
.fill{position:absolute;top:0;bottom:0;border-radius:4px}
.fill.t{background:var(--gold-deep)}.fill.f{background:var(--red)}
.fill.g{background:var(--green-deep)}.fill.c{background:var(--coral-deep)}
.thumb{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:9px;font-variant-numeric:tabular-nums}
.read{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px}
.read b,.said b{font-weight:700}
.said{font-size:16px}
.answer{display:flex;flex-direction:column;gap:0}
.answer-zone{position:relative;height:44px;flex:none}
.answer-zone .rail{position:absolute;left:0;right:0;top:18px;margin:0}
.answer-zone input{position:absolute;inset:0;width:100%;height:44px;min-height:44px;margin:0;opacity:0;cursor:pointer;touch-action:pan-y}
.answer-zone:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
.answer-zone input,.scrub-zone input{-webkit-tap-highlight-color:transparent}
.answer-zone input:focus{outline:none}
.answer-labels{position:relative;height:32px;font-size:13px;font-stretch:75%;line-height:1.1}
.answer-label{position:absolute;top:0;transform:translateX(-50%);width:20%;text-align:center;white-space:nowrap;font-weight:500;cursor:default}
.answer-labels.three .answer-label{width:36%}
.answer[data-question="true"] .answer-labels{font-size:12px;font-stretch:75%}
.answer-label.on{font-weight:750}
.answer-label.tight{font-size:.82em;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.answer-label.on.t{color:var(--gold-deep)}.answer-label.on.f{color:var(--red)}
.answer-label.on.g{color:var(--green-deep)}.answer-label.on.c{color:var(--coral-deep)}
.answer .ends{margin:0 0 9px}
.answer .pins{margin-top:0}
.answer .said,.answer .hint{margin-top:2px}
.words-link{font-size:14.5px;color:var(--ink2)}
.words-sheet{z-index:6}
.word-row{display:flex;flex-direction:column;gap:8px}
.word-row .starters{gap:5px}
.word-row .pill{padding:0 12px}
.word-own{width:8.2em;min-height:44px;padding:0 12px;border-radius:22px;border:1.5px dashed var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600}
.word-own::placeholder{color:var(--ink2);font-weight:500;opacity:1}
.word-own.on{border-style:solid;border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.meet{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.follow{display:flex;flex-direction:column;gap:11px;padding-top:14px;border-top:1px solid var(--line)}
.follow .rail{margin-top:0}
.done{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:650}

/* buttons */
.btn{min-height:48px;border-radius:14px;padding:0 18px;font-weight:650;border:1.5px solid var(--ink);background:transparent}
.btn.primary{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.btn.violet{background:var(--violet);color:var(--on-violet);border-color:var(--violet)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.link{align-self:flex-start;min-height:44px;background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* the first reflection */
.welcome-skip{float:right;margin-left:12px;font-size:14px}
.intro{margin:0 0 18px;color:var(--ink)}
.reflection{display:flex;flex-direction:column;gap:14px}

/* sheets: your five words, and who sits where */
.sheet{position:absolute;inset:0;z-index:5;background:var(--ground);display:flex;flex-direction:column}
.sheet-head{flex:none;display:flex;justify-content:space-between;align-items:center;padding-block:14px 8px}
.sheet-head h2{font-size:22px;font-weight:750;letter-spacing:-.01em}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding-block:8px 28px;display:flex;flex-direction:column;gap:18px}
.form{display:flex;flex-direction:column;gap:20px}
.form > div{display:flex;flex-direction:column;gap:10px}
.ctx{background:var(--violet-soft);border-radius:14px;padding:10px 12px;font-size:15px}
.starters{display:flex;flex-wrap:wrap;gap:6px;flex-direction:row !important}
.pill{min-height:44px;border-radius:22px;padding:0 14px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.pill.ex{border-style:dashed;border-color:var(--ink2);text-align:left;height:auto;padding:9px 14px;line-height:1.25;font-weight:500}
textarea{width:100%;border:1.5px solid var(--ink);border-radius:16px;background:var(--surface);padding:12px 14px;font-size:19px;line-height:1.3;resize:none}
textarea::placeholder{color:var(--ink2);opacity:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .pill{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;min-height:48px;padding:0 8px;font-size:14.5px}

/* one reveal: the others arrive after your answer */
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pins.anim .pin{animation:drop .35s ease-out both}
.rail.anim .fill.r{transform-origin:left center;animation:grow .3s ease-out both}
.rail.anim .fill.l{transform-origin:right center;animation:grow .3s ease-out both}
.in{animation:rise .35s .2s ease-out both}
@media (prefers-reduced-motion: reduce){
  .pins.anim .pin,.rail.anim .fill,.in{animation:none}
  .toast{transition:none}
}

/* ===== shared additions for the three-look build (unscoped: this is also how Modern draws them) ===== */
.string,.spool,.sky{display:none}
.answer-label.on.t{color:var(--gold-text)}.answer-label.on.f{color:var(--red-text)}
.answer-label.on.g{color:var(--green-text)}.answer-label.on.c{color:var(--coral-text)}

/* first visit, steps 1 and 2: pick a look, pick colours */
.step{font-size:13px;color:var(--ink2);margin-bottom:6px;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;min-height:104px;padding:10px 14px 10px 10px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.opt-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt-text b{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.opt-text span{font-size:14.5px;color:var(--ink2);line-height:1.25}
.opt-check{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.opt[aria-pressed="true"] .opt-check{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.opt[aria-pressed="false"] .opt-check svg{visibility:hidden}
.opts.compact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.compact .opt{flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:7px;min-height:0;padding:7px 7px 9px;border-radius:16px}
.opts.compact .pv{width:100%}
.opts.compact .opt-text span,.opts.compact .opt-check{display:none}
.opts.compact .opt-text b{font-size:15px;text-align:center}

/* the thumbnails are small fixed drawings of each look, so they never take on the look around them */
.pv{flex:none;position:relative;display:block;width:112px;height:84px;border-radius:12px;overflow:hidden}
.pv i{position:absolute;display:block}
.pv .pv-x{display:none}
.pv[data-pv="modern"]{background:#EDF1F5}
.pv[data-pv="modern"] .pv-card{left:10px;right:10px;top:10px;height:46px;border-radius:9px;background:#fff;box-shadow:0 4px 10px rgba(23,32,58,.14)}
.pv[data-pv="modern"] .pv-l1{left:8px;top:8px;width:58px;height:6px;border-radius:3px;background:#17203A}
.pv[data-pv="modern"] .pv-l2{left:8px;top:19px;width:38px;height:5px;border-radius:3px;background:#C9D1DC}
.pv[data-pv="modern"] .pv-rail{left:8px;right:8px;top:33px;height:4px;border-radius:2px;background:linear-gradient(90deg,#C9D1DC 0 50%,#A87F00 50% 74%,#C9D1DC 74%)}
.pv[data-pv="modern"] .pv-dot{left:calc(74% - 5px);top:-3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #17203A}
.pv[data-pv="modern"] .pv-btn{left:10px;bottom:9px;width:52px;height:12px;border-radius:6px;background:#17203A}
.pv[data-pv="notebook"]{background:#F7F2E6 repeating-linear-gradient(to bottom,transparent 0 11px,rgba(86,128,186,.28) 11px 12px)}
.pv[data-pv="notebook"] .pv-card{left:12px;right:12px;top:14px;height:44px;background:#FFFDF6;border-radius:1px 2px 1px 3px;box-shadow:0 3px 5px rgba(70,50,20,.24);transform:rotate(-2deg)}
.pv[data-pv="notebook"] .pv-l1{left:8px;top:10px;width:54px;height:5px;border-radius:3px 2px 3px 2px;background:#2B2A33}
.pv[data-pv="notebook"] .pv-l2{left:8px;top:20px;width:36px;height:4px;border-radius:2px;background:#8E8676}
.pv[data-pv="notebook"] .pv-rail{left:8px;right:8px;top:30px;height:7px;border-radius:1px;border:1px solid #B4975A;background:linear-gradient(90deg,transparent 0 50%,rgba(242,184,36,.95) 50% 74%,transparent 74%),#E9D3A0}
.pv[data-pv="notebook"] .pv-dot{left:calc(74% - 6px);top:-4px;width:11px;height:11px;border-radius:50%;background:#3F5BA9;border:1.5px solid #22305F}
.pv[data-pv="notebook"] .pv-btn{left:12px;bottom:8px;width:50px;height:12px;border-radius:5px 6px 4px 7px;background:#2B2A33}
.pv[data-pv="notebook"] .pv-x{display:block;left:calc(50% - 17px);top:7px;width:34px;height:11px;background:rgba(111,201,165,.82);transform:rotate(-4deg)}
.pv[data-pv="future"]{background:radial-gradient(90% 70% at 92% 0,rgba(74,110,214,.6),transparent 62%),radial-gradient(circle at 16% 80%,#fff 0 .8px,transparent 1.3px),radial-gradient(circle at 60% 90%,#fff 0 .7px,transparent 1.2px),radial-gradient(circle at 88% 70%,rgba(255,255,255,.75) 0 .7px,transparent 1.2px),#0B1026}
.pv[data-pv="future"] .pv-card{left:10px;right:10px;top:10px;height:46px;border-radius:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.26)}
.pv[data-pv="future"] .pv-l1{left:8px;top:8px;width:58px;height:5px;border-radius:3px;background:#F2F5FF}
.pv[data-pv="future"] .pv-l2{left:8px;top:18px;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.42)}
.pv[data-pv="future"] .pv-rail{left:8px;right:8px;top:32px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.5) 0 50%,#F2B824 50% 74%,rgba(255,255,255,.5) 74%);box-shadow:0 0 6px rgba(242,184,36,.6)}
.pv[data-pv="future"] .pv-dot{left:calc(74% - 5px);top:-4px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(166,205,247,.3),0 0 8px 2px #A6CDF7}
.pv[data-pv="future"] .pv-btn{left:10px;bottom:9px;width:52px;height:12px;border-radius:6px;background:#A6CDF7;box-shadow:0 0 10px rgba(166,205,247,.6)}
.pv[data-pv="professional"]{background:#FAFAFA}
.pv[data-pv="professional"] .pv-card{left:9px;right:9px;top:9px;height:48px;border-radius:4px;background:#fff;border:1px solid #E2E8F0}
.pv[data-pv="professional"] .pv-l1{left:7px;top:7px;width:30px;height:8px;border-radius:4px;background:#F3E8FF;box-shadow:inset 0 0 0 1px #E3CCFB}
.pv[data-pv="professional"] .pv-l2{left:7px;top:21px;width:66px;height:3px;border-radius:2px;background:#334155}
.pv[data-pv="professional"] .pv-rail{left:7px;right:7px;top:33px;height:3px;border-radius:2px;background:linear-gradient(90deg,#FDE68A 0 74%,#E2E8F0 74%)}
.pv[data-pv="professional"] .pv-dot{left:calc(74% - 4px);top:-3px;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #F2C94C}
.pv[data-pv="professional"] .pv-btn{left:auto;right:9px;bottom:8px;width:34px;height:11px;border-radius:3px;background:#2A9D8F}

/* ten colour names */
.sws{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 2px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:76px;padding:7px 0 4px;border:0;background:none;border-radius:14px;font-size:12.5px;line-height:1.1;color:var(--ink2)}
.sw-dot{display:block;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:linear-gradient(135deg,var(--s1) 0 48%,var(--s2) 48% 60%,var(--s3) 60%)}
.sw[aria-pressed="true"]{color:var(--ink);font-weight:700}
.sw[aria-pressed="true"] .sw-dot{border-color:var(--ink);box-shadow:0 0 0 2.5px var(--ground),0 0 0 5px var(--ink)}
.card.sample{gap:10px}
.card.sample .answer + .answer{margin-top:4px}
.btnrow.setup{flex-wrap:nowrap}
.btnrow.setup .btn.primary{flex:1;min-width:0;padding:0 12px}

/* the answer line, reordered: False and True above it, the words link under the words, then what you said */
.answer .ends{margin:0 0 -5px}
.ends.off{visibility:hidden}
/* your group on the line: their circles sit above it from the start, yours drops in when you answer */
.answer [data-line-pins]{margin-bottom:-3px}
.answer .ends + [data-line-pins]{margin-top:8px}
.pin.new{animation:drop .35s ease-out both}
@media (prefers-reduced-motion: reduce){ .pin.new{animation:none} }
/* a big group: from eight answers on a line, the circles give way to a shape of where people cluster. The shape sits
   on the line itself; "See all N" under it (or a tap on the shape) opens the names. */
.crowd{cursor:pointer}
.crowd svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.crowd-fill{fill:var(--ink2);fill-opacity:.24}
.crowd-edge{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linejoin:round}
.answer [data-line-pins].crowded{margin-bottom:-14px}
.pins.crowd + .rail{margin-top:0}
.line-foot{display:flex;justify-content:space-between;align-items:center;gap:0 12px}
.line-foot > [data-line-read],.line-foot > .after{flex:1;min-width:0}
.line-foot .link{align-self:center}
.who-link{flex:none;margin-left:auto;font-size:14.5px}
.who-sheet{z-index:6}
.who-sheet .card{gap:10px}
.who-group{display:flex;flex-direction:column;gap:10px}
.who-group h3{margin:0;display:flex;align-items:baseline;gap:8px;font-size:18px;line-height:1.2;font-weight:700}
.who-group h3 .num{font-size:14.5px;font-weight:500;color:var(--ink2)}
.who-names{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 16px}
.who-names li{display:flex;align-items:center;gap:8px;min-width:0;font-size:15.5px}
.who-names li .num{margin-left:auto;font-size:14px;color:var(--ink2)}
/* the symbol picker on the You tab: one row per kind of thought, each button shows one symbol */
/* every thought of a kind in the ink this person picked for that kind (their screen only) */
:root[data-ink-noticed] [data-kind="noticed"] .trow-text,:root[data-ink-noticed] .open-card[data-kind="noticed"] > .say{color:var(--ink-noticed)}
:root[data-ink-believe] [data-kind="believe"] .trow-text,:root[data-ink-believe] .open-card[data-kind="believe"] > .say{color:var(--ink-believe)}
:root[data-ink-predict] [data-kind="predict"] .trow-text,:root[data-ink-predict] .open-card[data-kind="predict"] > .say{color:var(--ink-predict)}
:root[data-ink-wonder] [data-kind="wonder"] .trow-text,:root[data-ink-wonder] .open-card[data-kind="wonder"] > .say{color:var(--ink-wonder)}
.inks .mopts{gap:2px}
.inko{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none}
.inko i{width:26px;height:26px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.inko[aria-pressed="true"] i{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--ink)}
@media (max-width:999px){ .inks .mrow{flex-direction:row;align-items:center;gap:8px} .inks .mrow-name{width:86px} .inks .mopts{display:grid;grid-template-columns:repeat(4,44px);gap:0 2px} }
.mrows{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px}
.mrow-name{flex:none;width:86px;font-size:14.5px;font-weight:600}
.mopts{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.mo{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);padding:0}
.mo[aria-pressed="true"]{border-color:var(--btn);box-shadow:0 0 0 1.5px var(--btn)}
.mo .kmark{--km:30px}
/* setup step 3: one card per kind of thought, with its symbol choices */
.kcards{display:flex;flex-direction:column;gap:10px}
.kcard{gap:12px}
.kcard-head{display:flex;align-items:center;gap:12px}
.kcard-head .kmark{--km:40px}
.kcard-head .after{margin-top:2px}
@media (min-width:1000px){
  .s-marks{padding-inline:max(28px,calc(50% - 390px))}
  .s-marks .kcards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .s-marks .btnrow.setup{max-width:444px}
}
/* ===== layout v11: one skeleton that the three looks dress =====
   Under 1000px: a phone. Tabs at the bottom, a one-line "Say something" bar that unfolds, Browse under it.
   From 1000px: a page. One top row of text tabs, Say it at a fixed width on the left, Browse taking the rest.
   Selectors here stay one class deep wherever a look restyles the thing, because the looks are scoped with
   :where() and rank as bare selectors. */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
h3{margin:0}
select{font:inherit;color:inherit}

/* phone: the parts of the bar sit in the page column and the tabs drop to the bottom */
.topbar{display:contents}
.bar-end,.strip{display:none}
.tabs{order:9}
@media (min-width:640px) and (max-width:999px){ .app{max-width:600px;align-self:center} }

/* the four kind marks: one drawing per kind, used on the kind buttons, the filter and every row */
.kmark{display:block;flex:none;width:var(--km,26px);height:var(--km,26px);border-radius:8px;background:var(--tile) var(--svg-g_noticed) center/62% no-repeat}
.kmark[data-k="believe"]{background-image:var(--svg-g_believe)}
.kmark[data-k="predict"]{background-image:var(--svg-g_predict)}
.kmark[data-k="wonder"]{background-image:var(--svg-g_wonder)}

/* ---------- the home: Say it, then Browse ---------- */
.v-home{gap:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.panel-head h2{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.005em}

/* Say it: the one writing place */
.sayit{flex:none;display:flex;flex-direction:column;background:var(--surface);border-radius:20px}
.say-bar{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 16px;border:0;border-radius:20px;background:none;text-align:left;font-size:17px;font-weight:600;color:var(--ink2)}
.say-bar svg{flex:none;color:var(--ink)}
.say-form{display:none;flex-direction:column;gap:14px;padding:12px 14px 0}
.sayit.open .say-bar{display:none}
.sayit.open .say-form{display:flex}
.field,.sl{position:relative;display:flex;flex-direction:column;gap:6px}
/* the text box grows with what is written in it, so a long thought is never cut off */
.field textarea{field-sizing:content;min-height:98px;max-height:200px}
.sl [data-line-read]{position:absolute;top:0;right:0}
.sl .said,.sl .hint{margin:0;font-size:15px;line-height:24px}
.sl .answer-labels{height:24px}
.sl .q{margin:0;line-height:24px}
.hint.vals{margin:-4px 0 0;font-size:14px;line-height:20px}
.say-x{margin:-4px -4px -4px 0}
.rctx{display:inline-flex;align-items:center;gap:8px;height:30px;margin-left:auto;padding:0 10px 0 11px;border-radius:15px;background:var(--violet-soft);font-size:13.5px;font-weight:600;white-space:nowrap}
.rctx .link{align-self:center;min-width:44px;min-height:44px;margin-block:-7px;font-size:13.5px}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;min-height:66px;padding:8px 1px 7px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:650;font-stretch:86%;line-height:1.1}
.kbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.gloss{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-block:-10px}
.gloss .link{flex:none;align-self:center;font-size:14.5px}
.say-go{display:flex;flex-direction:column;gap:6px;padding-bottom:14px}
.go-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px}
.vt{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.vt .pick{width:auto;min-width:0;height:48px;padding:0 4px;font-size:14px}
/* notifications, the "more" sheet, the weigh-in starting points, the chat */
.bell{position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--note-ink,var(--ink))}
.bell-n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--btn);color:var(--on-btn);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.search.link-box{flex:none;width:100%}
.asks{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ask{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.ask input{flex:none;width:20px;height:20px;accent-color:var(--btn)}
.sheet-h3{font-size:16px;font-weight:700}
.presets{display:flex;flex-wrap:wrap;align-items:center;margin-left:-8px}
.presets-h{margin-left:8px;font-size:13.5px;font-weight:650;color:var(--ink2)}
.chat-log{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:94%}
.msg.me{align-self:flex-end;padding:8px 12px;border-radius:14px;background:var(--tile)}
.msg p{font-size:15.5px;line-height:1.35}
.chat-in{display:flex;gap:8px}
.chat-in .btn{flex:none;min-height:44px;padding:0 16px}
/* looking after the group */
.prows{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding-block:6px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow > div{flex:1;min-width:0}
.prow .after{margin-top:1px}
.perms{display:flex;flex-wrap:wrap;gap:6px}
.use{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.use li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.v-page .card > .pick{width:100%}
.go-foot{display:flex;align-items:center;gap:10px}
.go-foot .fine{flex:1;min-width:0}
.go-foot .link{flex:none;align-self:center;margin-block:-13px;font-size:13.5px}
.pick.more{width:auto;padding:0 12px}
.pick[aria-pressed="true"],.pick.more[aria-expanded="true"]{border-color:var(--ink)}
.fmore{display:none;flex-wrap:wrap;gap:8px;flex:1 1 100%}
.fmore.open{display:flex}
.fmore .pick{flex:1 1 130px;width:auto}
/* the time range: one line, two handles. Each handle is a 44px target with a small drawn knob in its middle. */
.scrub{flex:1 1 100%;display:flex;flex-direction:column;min-width:0}
.scrub-row{display:flex;align-items:center;font-size:13px;color:var(--ink2)}
.scrub-row .scrub-zone{flex:1;min-width:0}
.scrub-read:has(#f-any[hidden]){display:none}
.scrub-zone{position:relative;height:44px}
.scrub-zone .rail{position:absolute;left:22px;right:22px;top:18px;margin:0}
.scrub-zone .fill{background:var(--btn)}
.scrub-zone input{position:absolute;left:0;top:0;width:100%;height:44px;margin:0;padding:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.scrub-zone input.top{z-index:1}
.scrub-zone input::-webkit-slider-runnable-track{height:44px;background:none;border:0}
.scrub-zone input::-moz-range-track{height:44px;background:none;border:0}
.scrub-zone input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 7px,var(--ink) 7.5px 10.5px,transparent 11px);cursor:pointer}
.scrub-zone input::-moz-range-thumb{pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 7px,var(--ink) 7.5px 10.5px,transparent 11px);cursor:pointer}
.scrub-zone input:focus-visible{outline:3px solid var(--ink);outline-offset:-3px;border-radius:8px}
.scrub-read{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px;font-size:14px;color:var(--ink2)}
.scrub-read .link{align-self:center;margin-block:-10px;font-size:13.5px}
.topic{margin-left:8px;padding:1px 8px;border-radius:10px;background:var(--tile);font-size:12.5px;font-weight:650;color:var(--ink2)}
.mx-tools{display:flex;align-items:center;gap:12px;margin-left:auto}
.mx-head .link{align-self:center;min-height:44px;margin-block:-7px;font-size:13px}
.mx-q{font-size:15px}
.go-row .pill{min-width:0;padding:0 4px;white-space:nowrap}
.go-row .btn{min-width:0;padding:0 8px}
/* the line about drafts: under the bar while the form is folded, under the title once it is open */
/* after a first reflection: the Say area and the three other kinds are lit, once with a pulse */
.sayit{--beckon:var(--violet);--beckon-soft:var(--violet-soft)}
.sayit.invite{box-shadow:0 0 0 2px var(--beckon),0 0 26px -6px var(--beckon)}
.sayit.invite .kbtn:not([data-id="noticed"]),.door{border-color:var(--beckon);box-shadow:0 0 0 3px var(--beckon-soft)}
.sayit.invite.pulse{animation:beckon 1.3s ease-in-out 2}
.sayit.invite.pulse .kbtn:not([data-id="noticed"]),.sayit.invite.pulse .door{animation:beckon-k 1.3s ease-in-out 2}
@keyframes beckon{50%{box-shadow:0 0 0 4px var(--beckon),0 0 44px -2px var(--beckon)}}
@keyframes beckon-k{50%{box-shadow:0 0 0 6px var(--beckon-soft),0 0 18px 0 var(--beckon)}}
@keyframes beckon-f{50%{box-shadow:inset 0 1px 0 var(--sheen),0 18px 40px -24px rgba(0,0,0,.8),0 0 0 2px var(--accent),0 0 76px -6px var(--accent)}}
@keyframes beckon-fk{50%{box-shadow:0 0 0 2px var(--accent),0 0 36px -2px var(--accent)}}
.say-form .doors{gap:2px}
.say-form .door-no{min-height:44px;margin-block:-8px -6px}
.doors{display:flex;flex-direction:column;gap:10px}
.doors .say-note{align-items:flex-start;padding-bottom:0}
.door-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:80px;padding:9px 4px;border-radius:14px;border:1.5px solid var(--beckon);background:var(--surface);font-size:13.5px;line-height:1.15;text-align:center}
.door b{font-weight:650}
.door-start{font-size:12.5px;color:var(--ink2)}
.door-no{align-self:flex-end;font-size:14px}
.note-out .doors{padding-bottom:12px}
@media (prefers-reduced-motion: reduce){ .sayit.invite.pulse,.sayit.invite.pulse .kbtn,.sayit.invite.pulse .door{animation:none} }
.note-out{padding:0 16px}
.note-out .say-note{padding-bottom:14px}
.sayit.open .note-out{display:none}
.trow-note{padding:2px 0 12px;cursor:default}
.nudge{gap:8px}
/* a date on a prediction (v12): the link beside the gloss, the box it opens, and the look-back lines */
#c-date{display:inline-flex;align-items:center;gap:5px}
.datebox{padding-top:12px;border-top:1px solid var(--line)}
.datebox .q,.datebox .hint,.due .hint{margin:0;padding:0}
.pick.day{align-self:flex-start;width:auto;min-width:170px;padding:0 10px}
.date-acts{display:flex;gap:20px}
.date-acts .link{align-self:center}
.due{gap:10px}
.due .btn{align-self:flex-start}
.lookback{text-wrap:balance}
.trow-note .sec .hint{padding-bottom:0}

/* Browse: the one reading place */
.browse{display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--surface);border-radius:20px;padding:12px 14px 6px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.kfilter{display:flex;flex:1 1 100%;gap:4px}
.kf{flex:1;display:grid;place-items:center;min-width:44px;height:44px;padding:0 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:650}
.kf[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick{flex:none;width:122px;height:44px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;color:var(--ink)}
.search{flex:1;min-width:0;width:0;height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--tile);font-size:15px;color:var(--ink)}
.search::placeholder{color:var(--ink2);opacity:1}
.count{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font-size:14.5px;color:var(--ink2)}
.count{flex-wrap:wrap}
.count > span{flex:1 1 0;min-width:0}
.count .link{flex:none;align-self:center;margin-block:-12px}
/* a wide Browse panel: every filter on one line and the time bar under it, with no "Filters" button */
.browse{container-type:inline-size}
@container (min-width:750px){
  .filters{align-items:center}
  .kfilter{flex:none}
  .filters > .pick,.fmore .pick{flex:0 1 118px;width:auto;min-width:0}
  .filters > .search{order:5;flex:1 1 110px;min-width:110px}
  .filters > .pick.more{display:none}
  .fmore,.fmore.open{display:contents}
  .scrub{order:9;flex:1 1 100%}
}
.list{display:flex;flex-direction:column}

/* a thought in the list: kind and date, the text, one thin line, a foot line */
.trow{display:flex;flex-direction:column;gap:6px;min-width:0;padding:13px 0 3px;border-top:1px solid var(--line);cursor:pointer}
.trow-head{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--ink2)}
.kind{--km:22px;display:inline-flex;align-items:center;gap:7px;font-weight:650;color:var(--ink)}
.tag{padding:2px 8px;border-radius:8px;background:var(--btn);color:var(--on-btn);font-size:12.5px;font-weight:650}
.when{margin-left:auto;white-space:nowrap}
.trow-text{max-width:64ch;font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.005em;text-wrap:pretty;overflow-wrap:anywhere}
.thins{display:flex;flex-direction:column;gap:2px}
.thin{display:flex;align-items:center;gap:10px;min-height:28px}
.thin-lbl{flex:none;width:36px;font-size:11.5px;font-weight:650;color:var(--ink2)}
.thin-line{position:relative;flex:1;min-width:0;max-width:560px;height:28px}
.thin-line .pins{position:absolute;inset:0;z-index:1;height:auto;margin:0}
.thin-line .pin{bottom:4px;width:22px;height:22px;margin-left:-11px;font-size:11px}
.thin-line .rail{position:absolute;left:0;right:0;top:50%;height:4px;margin:-2px 0 0;border-radius:2px}
.thin-line .mid{top:-4px;height:12px}
.thin-line .thumb{display:none}
.thin-line.crowded .rail{top:auto;bottom:1px;margin:0}
.thin .who-link{min-height:44px;margin-block:-7px;font-size:13.5px}
.trow-foot{display:flex;align-items:center;flex-wrap:wrap;gap:0 12px;min-height:44px;font-size:13.5px;color:var(--ink2)}
.who{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.trow-acts{display:flex;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.mini{display:inline-flex;align-items:center;justify-content:flex-end;min-width:44px;min-height:44px;padding:0 0 0 8px;border:0;background:none}
.mini span{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;border:1.5px solid var(--line);font-size:13.5px;font-weight:650;white-space:nowrap}
.mini.go span{border-color:var(--ink)}
.mini[aria-pressed="true"] span{border-color:var(--ink);background:var(--tile)}
/* the same three buttons on the opened thought, from the left */
.card-acts{margin-left:-8px;justify-content:flex-start}
.weigh{display:flex;flex-direction:column;gap:11px}
/* Single or Multi, in the head of the writing place; and the parts of Multi */
.modes{display:inline-flex;flex:none;margin-left:auto}
.modes .mini{margin-block:-6px;padding-left:6px}
.methods{display:flex;gap:6px}
.methods .pill{display:inline-flex;align-items:center;gap:8px}
.field #c-free{min-height:150px;max-height:320px}
.mxs{display:flex;flex-direction:column;gap:12px}
.mx{display:flex;flex-direction:column;gap:8px;padding:8px 12px 12px;border-radius:14px;border:1.5px solid var(--line)}
.mx-head{display:flex;align-items:center;justify-content:space-between;min-height:30px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.mx-head .cref-x{margin:-7px -10px -7px 0}
.mx .field textarea{min-height:54px;max-height:140px}
.mx-kinds{display:flex;align-items:center;gap:6px}
.mx-kinds .kf{flex:none;width:48px}
.mx-kind{margin-left:6px;font-size:14px;font-weight:650}
.bar-refs{flex:none;margin-left:auto;padding:3px 10px;border-radius:12px;background:var(--tile);font-family:var(--font);font-size:13px;font-weight:650;letter-spacing:0;color:var(--ink)}
.fresh{animation:rise .35s ease-out both}

/* a thought opened inside Browse, with its replies indented under it */
.back{display:inline-flex;align-items:center;gap:4px;margin:-6px 0 -6px -5px;font-size:15px}
.card-tail{display:flex;flex-direction:column;gap:10px}
.replies{display:flex;flex-direction:column;margin-left:8px;padding-left:16px;border-left:2px solid var(--line)}
.replies.sub{margin:0 0 6px 2px;padding-left:12px}
.replies.sub.flat{margin-left:0;padding-left:0;border-left:0}
.keep{margin:-2px 0 4px;font-size:13.5px}
.keep .link{min-height:44px;margin-block:-12px;font-size:13.5px;vertical-align:baseline}
.steps{font-size:13.5px;color:var(--ink2)}
.steps summary{display:flex;align-items:center;min-height:44px;margin-block:-11px;font-weight:650;cursor:pointer}
.steps ol{list-style:none;margin:2px 0 8px;padding:0 0 0 10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:3px}
.steps li{display:flex;justify-content:space-between;gap:12px}
.steps li span:first-child{flex:1;min-width:0}
.steps li .num{flex:none;white-space:nowrap}
.steps summary,.fold summary{list-style:none}
.steps summary::-webkit-details-marker,.fold summary::-webkit-details-marker{display:none}
.steps summary::before,.fold summary::before{content:"";flex:none;width:7px;height:7px;margin:0 9px 0 2px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
.steps[open] > summary::before,.fold[open] > summary::before{transform:rotate(45deg);margin-top:-3px}
.msg.now .steps li{animation:rise .3s ease-out both}
.msg.now .steps li:nth-child(2){animation-delay:.35s}
.msg.now .steps li:nth-child(3){animation-delay:.7s}
.msg.now .steps li:nth-child(n+4){animation-delay:1.05s}
.msg.now .steps ~ p{animation:rise .35s 1.4s ease-out both}
@media (prefers-reduced-motion: reduce){ .msg.now .steps li,.msg.now .steps ~ p{animation:none} }
.addr{font-size:16px;color:var(--ink);overflow-wrap:anywhere}
.fold summary{display:flex;align-items:center;min-height:44px;font-size:15px;font-weight:650;cursor:pointer}
.fold[open]{display:flex;flex-direction:column;gap:10px}
.sheet-body textarea{font-size:16px}
.mini.share span{padding:0 9px}
.mx-on{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:-7px 0;padding-left:8px;font-size:13.5px;font-weight:650;color:var(--ink);cursor:pointer}
.mx-on input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--btn)}
.mx.off{padding-bottom:10px;background:var(--tile)}
.mx-left{overflow-wrap:anywhere}
.replies h3{padding-bottom:10px;font-size:15px;line-height:1.2;font-weight:700}
.replies .hint{padding-bottom:12px}
/* references: the thoughts a thought points at (in the opened thought and in the writing place), and the ones that point at it */
.refs{display:flex;flex-direction:column;gap:6px}
.crefs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.crefs-h{flex:none}
.cref{flex:1 1 220px;min-width:0}
.refs-h,.crefs-h{font-size:13.5px;font-weight:700;color:var(--ink2)}
.refrow{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:14.5px}
.refrow .kmark{--km:22px}
.refrow-text{flex:1;min-width:0;line-height:1.3}
.cref-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refrow-who{flex:none;font-size:13px;color:var(--ink2)}
.refd{margin-top:16px}
.cref{display:flex;align-items:center;gap:8px;min-height:44px;padding-left:10px;border-radius:12px;background:var(--tile);font-size:13.5px}
.cref .kmark{--km:20px}
.cref-x{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;background:none}

/* Iris, just before a thought is staked */
.pop{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:16px;background:rgba(12,16,30,.44)}
.pop-box{display:flex;flex-direction:column;gap:10px;width:min(380px,100%);max-height:100%;overflow-y:auto;padding:18px;border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pop-box h2{font-size:23px;line-height:1.12;font-weight:750;letter-spacing:-.01em}
.pop-why{font-size:15.5px}
.pop-text{padding:10px 12px;border-radius:12px;background:var(--tile);font-size:16px;font-weight:600;overflow-wrap:anywhere}
.pop-acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pop-acts .link{align-self:center}

/* sheets are a full screen on a phone; the box only matters on a wide screen */
.sheet-box{display:contents}

/* the other places */
.v-page .who-names{margin-top:2px}
.v-page .card > .btn{align-self:flex-start}

/* ---------- Iris workbench: Say it on the left, Iris in the middle, Live Ledger on the right ---------- */
.v-iris{gap:14px}
.iris-pane,.iris-ledger{display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--surface);border-radius:20px;padding:12px 14px}
.iris-rail{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:650;color:var(--ink);cursor:pointer;user-select:none}
.iris-rail-ico{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--tile);font-size:17px;line-height:1;font-weight:700;color:var(--ink)}
.iris-rail-lbl{white-space:nowrap}
.iris-head{gap:8px;flex-wrap:wrap}
.iris-title{display:inline-flex;align-items:center;gap:8px}
.iris-title h1{margin:0;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.005em}
.iris-mode-sw{display:inline-flex;align-items:center;gap:2px;padding:0 4px;border-radius:999px;background:var(--tile)}
.iris-mode-sw .mini{min-width:0;padding-inline:2px}
.iris-mode-sw .mini span{border-color:transparent;background:transparent}
.iris-mode-sw .mini.go span{border-color:var(--btn);background:var(--btn);color:var(--on-btn)}
.iris-head-acts{display:inline-flex;align-items:center;gap:2px;margin-left:auto}
.iris-head-acts .mini span{gap:5px}
.desk-bar{display:flex;flex-direction:column;gap:5px;padding:6px 10px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--ground)}
.desk-bar.empty{padding:7px 11px;border-style:dashed}
.desk-bar-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.desk-bar-head .link{min-height:32px;margin-block:-6px;font-size:12.5px}
.desk-bar-lbl{display:inline-flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.desk-bar-lbl b{color:var(--ink)}
.desk-chips{display:flex;flex-wrap:wrap;gap:6px}
.desk-chip i{font-style:normal;opacity:.65;margin-left:2px;font-size:14px;line-height:1}
.desk-chip:hover i{opacity:1}
.desk-see{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-4px}
.desk-see .iris-see{margin-top:0}
.iris-outputs{display:flex;flex-direction:column;gap:12px;min-width:0}
.desk-tray{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:20px;padding:12px 14px}
.desk-empty{margin:0;font-size:13.5px}
.out-cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--btn);color:var(--on-btn);font-size:12px;font-weight:700;vertical-align:1px}
.out-list{display:flex;flex-direction:column;gap:8px}
.out-card{display:flex;flex-direction:column;gap:6px;padding:10px 12px 4px;border:1.5px solid var(--line);border-radius:14px;background:var(--ground)}
.out-card.out-proto{border-color:var(--violet)}
.out-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.out-tag{font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.out-title{font-size:14px;font-weight:700;color:var(--ink)}
.out-body{font-size:14px;line-height:1.35;color:var(--ink)}
.out-diff{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:10px;background:var(--tile);font-size:13px;line-height:1.38}
.out-before{color:var(--ink2);text-decoration:line-through}
.out-before span,.out-after span{font-weight:700;text-decoration:none;display:inline-block;margin-right:4px}
.out-after{color:var(--ink);font-weight:600}
.out-acts{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.out-dir,.shaped-line{margin:0;font-size:11.5px;line-height:1.35;color:var(--ink2)}
.shaped-line{padding-top:2px;border-top:1px dashed var(--line)}
.lrow.pinned{border-color:var(--accent,var(--btn));box-shadow:inset 3px 0 0 var(--accent,var(--btn))}
.ue-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.ue-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.35}
.ue-ev.tested{border-color:var(--accent,var(--btn));background:var(--tint,var(--tile));color:var(--accent-text,var(--ink))}
.ue-ev.untested{border-style:dashed}
.asof-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.asof-lbl{font-size:12.5px;font-weight:650;color:var(--ink2);white-space:nowrap}
.asof-row .pick{flex:1;width:auto;min-width:0}
.asof-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:10px;border:1px solid var(--violet);background:var(--violet-soft);font-size:12px;color:var(--ink)}
.asof-banner .link{min-height:32px;margin-block:-4px;font-size:12px}
.asof-tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;background:var(--violet-soft);color:var(--ink);font-size:11.5px;font-weight:700}
.prov{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--ground);padding:6px 10px}
.prov summary{cursor:pointer;font-size:12.5px;font-weight:650;color:var(--ink2);list-style:none}
.prov summary::-webkit-details-marker{display:none}
.prov summary::before{content:"▸ ";display:inline-block;margin-right:2px}
.prov[open] summary::before{content:"▾ "}
.prov-list{list-style:none;margin:8px 0 6px;padding:0;display:flex;flex-direction:column;gap:4px}
.prov-btn{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;width:100%;min-height:44px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font-size:12.5px;color:var(--ink)}
.prov-btn:hover{border-color:var(--ink);background:var(--tile)}
.prov-who{color:var(--ink2)}
.prov-who b{color:var(--ink)}
.prov-role{margin-left:auto;padding:1px 7px;border-radius:999px;background:var(--tile);font-size:11px;font-weight:700;color:var(--ink)}
.prov-txt{flex-basis:100%;font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prov-note{margin:2px 0 0;font-size:11px}
.iris-body{display:flex;flex-direction:column;gap:12px;min-height:0}
.iris-notice{margin:0}
.iris-foot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.iris-foot-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.iris-settings{margin-left:auto}
.iris-settings-in{display:flex;flex-direction:column;gap:8px;padding:6px 0 2px}
.cite-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cite-chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;max-width:100%;padding:4px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.cite-chip .kmark{--km:16px}
.cite-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cite-chip.lit,.cite-chip:hover{border-color:var(--ink);background:var(--tile)}
.msg-acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:4px}
.iris-scope-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;border-radius:10px;background:var(--tile);font-size:12.5px;font-weight:650;color:var(--ink2)}
.iris-scope-bar span{display:inline-flex;align-items:center;gap:5px}
.iris-scope-bar .link{min-height:32px;margin-block:-4px;font-size:12.5px}
.lookback-pin{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;border-left:3px solid var(--violet);background:var(--violet-soft)}
.echo-card{display:flex;flex-direction:column;gap:5px;margin-top:8px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--tile)}
.echo-q{font-size:14.5px;line-height:1.32;font-weight:650;color:var(--ink)}
.priv-warn{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--ink);background:var(--violet-soft)}
.iris-look-card{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--tile)}
.iris-look-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.iris-look-sw{display:inline-flex;gap:4px}
.iris-look-sw i{display:block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}
.iris-see{margin-top:-4px;font-size:13px}
.iris-seg{display:flex;flex-wrap:wrap;gap:6px}
.iris-lscroll{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;flex-direction:column;gap:6px;padding:10px 12px 2px;border:1.5px solid var(--line);border-radius:14px;background:var(--ground);transition:border-color .15s,box-shadow .15s}
.lrow.lit{border-color:var(--ink);box-shadow:0 0 0 2px var(--violet-soft)}
.lrow-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.lrow-head .kind{--km:18px;font-size:12.5px}
.lrow-text{font-size:15px;line-height:1.32;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.lrow-foot{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;min-height:44px;font-size:12.5px;color:var(--ink2)}
.lrow-acts{display:flex;flex-wrap:wrap;margin-left:auto}
.iris-say-x,.iris-fold-btn{flex:none}

/* hidden self-restyle overlays (only applied when asked in Iris chat) */
.iris-roots-bg{display:none;position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
html[data-look][data-palette][data-iris-look="rhizome-roots"]{color-scheme:dark;--ground:#0a1312;--surface:#111d1b;--tile:#172926;--ink:#eaf2ed;--ink2:#9fb6ae;--body:#dce8e1;--line:#27403a;--line2:#1e342f;--btn:#78bfa2;--on-btn:#071310;--accent:#78bfa2;--accent-text:#95e2c3;--accent-soft:rgba(120,191,162,.24);--violet:#a898e0;--violet-soft:rgba(157,140,214,.22);--inset:#0d1816;--dock:rgba(10,19,18,.88);--field:#0d1816;--white:#162623;--sticky:#282a1a;--kraft:#1d2824;--kraft-deep:#141e1b;--chipbg:#192c28;--edge:#2b463f;--edge2:#243a35;--rule:rgba(120,191,162,.10);--margin:rgba(157,140,214,.20);--stack1:#14221f;--stack2:#0d1715;--pane1:rgba(17,29,27,.86);--pane2:rgba(10,19,18,.84);--glass:rgba(22,38,35,.72);--glass2:rgba(28,48,44,.84);--track:#223833;--chat-me:#78bfa2;--on-chat-me:#071310;--tint:rgba(120,191,162,.16)}
html[data-look][data-palette][data-iris-look="rhizome-roots"] .stage{background:#0a1312;background-image:none}

html[data-look][data-palette][data-iris-look="rhizome-roots"] .topbar,html[data-look][data-palette][data-iris-look="rhizome-roots"] .strip{background:rgba(10,19,18,.86);border-color:#243a35;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
html[data-look][data-palette][data-iris-look="rhizome-roots"] .iris-pane,html[data-look][data-palette][data-iris-look="rhizome-roots"] .iris-ledger,html[data-look][data-palette][data-iris-look="rhizome-roots"] .desk-tray,html[data-look][data-palette][data-iris-look="rhizome-roots"] .sayit,html[data-look][data-palette][data-iris-look="rhizome-roots"] .browse,html[data-look][data-palette][data-iris-look="rhizome-roots"] .iris-rail{background:rgba(17,29,27,.84);border-color:#27403a;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
html[data-look="modern"][data-palette][data-iris-look="rhizome-roots"] .kmark{background-color:#cde8dc}
html[data-look][data-palette][data-iris-look="warm-paper"]{color-scheme:light;--ground:#f7f2e7;--surface:#fffaf1;--tile:#efe7d6;--ink:#1f322b;--ink2:#556860;--body:#263932;--line:#d8ccb5;--line2:#e3d9c5;--btn:#2c6e59;--on-btn:#fffaf1;--accent:#2c6e59;--accent-text:#235b49;--accent-soft:rgba(44,110,89,.16);--violet:#6b5ca5;--violet-soft:rgba(107,92,165,.13);--inset:#f3ecde;--field:#fffcf5;--white:#fffaf1;--chipbg:#efe7d6;--chat-me:#2c6e59;--on-chat-me:#fffaf1;--tint:rgba(44,110,89,.12)}

@media (prefers-reduced-motion: reduce){ .fresh{animation:none} }

/* ---------- wide screens: a real page ---------- */
@media (min-width:1000px){
  .demo{display:none}
  .topbar{position:relative;z-index:2;flex:none;display:flex;align-items:stretch;gap:36px;height:60px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}
  .top{padding:0}
  .net{display:none}
  .bar-end{display:block;align-self:center;margin-left:auto;font-size:13.5px;color:var(--ink2)}

  .tab{flex-direction:row;min-height:0;padding:0 16px;font-size:16px;font-weight:600}
  .tab svg{display:none}
  .tab[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--ink)}
  .toast{bottom:22px}

  .scroll{padding:36px 28px 40px}
  .v-first{padding-inline:max(28px,calc(50% - 250px));padding-top:52px}

  .v-you{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-content:start;align-items:start;gap:20px;padding-inline:max(28px,calc(50% - 470px))}
  .v-you > div:first-child{grid-column:1 / -1}

  .v-home{display:grid;grid-template-columns:400px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:20px;padding:20px 24px;overflow:hidden}
  .v-iris{position:relative;display:grid;grid-template-columns:54px minmax(0,1fr) 336px;grid-template-rows:minmax(0,1fr);gap:16px;padding:20px 24px;overflow:hidden}
  .v-iris.draft-open{grid-template-columns:380px minmax(0,1fr) 336px}
  .v-iris.ledger-closed{grid-template-columns:54px minmax(0,1fr) 54px}
  .v-iris.draft-open.ledger-closed{grid-template-columns:380px minmax(0,1fr) 54px}
  /* Research Desk classic flow: Sources (left) -> Iris (center) -> Outputs + Say it (right) */
  .v-iris.iris-desk{grid-template-columns:336px minmax(0,1fr) 54px}
  .v-iris.iris-desk.draft-open{grid-template-columns:336px minmax(0,1fr) 380px}

  .v-iris.iris-desk.draft-open.ledger-closed{grid-template-columns:54px minmax(0,1fr) 380px}

  .v-iris.iris-desk .desk-tray{flex:none;border-radius:24px;padding:16px 18px 14px}
  .v-iris.iris-desk .sayit{height:auto;max-height:none;overflow:visible;flex:none}
  .v-iris .say-form{gap:10px;padding:14px 18px 0}
  .v-iris .field textarea{min-height:72px}
  .v-iris .say-go{padding-bottom:14px}
  .iris-rail{flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;height:100%;padding:16px 0;border-radius:20px}
  .iris-rail-lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;letter-spacing:.03em;color:var(--ink2)}
  .iris-pane{height:100%;overflow:hidden;border-radius:24px;padding:18px 22px 14px}
  .iris-body{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
  .iris-foot{flex:none}
  .iris-ledger{height:100%;overflow:hidden;border-radius:24px;padding:18px 18px 12px}
  .iris-lscroll{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
  .lrow-acts .mini{min-width:0;padding-left:5px}
  .lrow-acts .mini span{padding:0 9px;font-size:12.5px}
  .cite-chip{min-height:30px;padding:3px 10px;font-size:12.5px}
  .sayit{align-self:start;max-height:100%;overflow-y:auto;border-radius:24px}
  .say-bar{display:none}
  .say-form{display:flex;padding:18px 20px 0}
  .say-x{display:none}
  .say-go{padding-bottom:18px}
  .note-out{display:none}
  .browse{height:100%;overflow-y:auto;border-radius:24px;padding:18px 24px 10px}
  .opened > *{max-width:760px}
  .kfilter{flex:none}
  .kf{flex:none;min-width:48px}
  .pick{width:136px}
  .search{min-width:90px}

  .strip{flex:none;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 18px;min-height:44px;padding:6px 24px;border-top:1px solid var(--line);background:var(--ground);font-size:13.5px;color:var(--ink2)}
  .switch{display:flex;gap:6px}
  .sw-btn{min-height:30px;padding:0 12px;border-radius:15px;border:1.5px solid var(--line);background:transparent;font-size:13.5px;font-weight:600;color:var(--ink)}
  .sw-btn[aria-pressed="true"]{border-color:var(--btn);background:var(--btn);color:var(--on-btn)}

  .sheet{align-items:center;justify-content:center;background:rgba(12,16,30,.44)}
  .sheet-box{display:flex;flex-direction:column;width:min(480px,calc(100% - 48px));min-height:0;max-height:calc(100% - 48px);overflow:hidden;border-radius:24px;background:var(--ground);box-shadow:var(--shadow)}
  .sheet-head,.sheet-body{padding-inline:22px}
}
/* narrower desktop: keep conversation wide by floating the draft/output drawer over its edge */
@media (min-width:1000px) and (max-width:1179px){
  .v-iris:not(.iris-desk).draft-open{grid-template-columns:54px minmax(0,1fr) 300px}
  .v-iris:not(.iris-desk).draft-open.ledger-closed{grid-template-columns:54px minmax(0,1fr) 54px}
  .v-iris:not(.iris-desk).draft-open > .sayit{position:absolute;left:24px;top:20px;bottom:20px;width:372px;height:auto;z-index:6;box-shadow:0 20px 50px rgba(0,0,0,.32)}
  .v-iris:not(.iris-desk).draft-open > .iris-pane{grid-column:1 / 3}
  .v-iris.iris-desk.draft-open{grid-template-columns:300px minmax(0,1fr) 54px}
  .v-iris.iris-desk.draft-open.ledger-closed{grid-template-columns:54px minmax(0,1fr) 54px}
  .v-iris.iris-desk.draft-open > .iris-outputs{position:absolute;right:24px;left:auto;top:20px;bottom:20px;width:372px;height:auto;z-index:6;box-shadow:0 20px 50px rgba(0,0,0,.32)}
  .v-iris.iris-desk.draft-open > .iris-pane{grid-column:2 / 4}
}
@media (min-width:1200px){
  .s-look .opts{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .s-look .opt{min-width:0;flex-direction:column;align-items:flex-start;gap:14px;padding:16px 16px 18px}
  .s-look .pv{zoom:2}
  .s-look .opt-check{position:absolute;right:16px;bottom:18px}
  .s-look .opt-text{padding-right:36px}
}
/* a short laptop screen: the whole Say-it form still fits without scrolling */
@media (min-width:1000px) and (max-height:780px){
  .topbar{height:54px}
  .v-home{padding-block:14px}
  .say-form{gap:11px;padding-top:14px}
  .field textarea{min-height:76px}
  .say-go{padding-bottom:14px}
  .strip{min-height:36px;padding-block:3px}
}

/* ---------- Say it: the one writing place ---------- */
function ready(){ return !!C.kind && C.text.trim().length > 0; }
function autoKind(){ return !C.kind && C.text.trim().length > 0 && !reflecting(); }
function need(){
  if (!C.text.trim()) return "Write your thought first.";
  if (!C.kind) return "No kind picked. Iris will pick one and show you first.";
  if (C.v == null || (C.good == null && C.kind !== "wonder")) return "Staking saves it. A line you leave alone stays in the middle.";
  return "Staking saves it.";
}
function whoTopic(){ return '<div class="vt" id="c-vis">'+sel("c-seen","Who sees it",SEEN,C.vis)+sel("c-topic","Topic",TOPICS,C.topic)+'</div>'; }
function shortText(t){ var s = plain(t.text); return esc(s.length > 64 ? s.slice(0, 62).replace(/\s+\S*$/, "")+"…" : s); }
function reflectionEcho(){
  if ((C.kind !== "predict" && C.kind !== "believe") || !C.text.trim() || reflecting()) return null;
  var q = C.text.toLowerCase(), keys = ["budget","money","call","phone","dinner","hike","rain","morning","meeting","walk","sleep","heating"];
  var hit = keys.filter(function(w){ return q.indexOf(w) >= 0; });
  if (!hit.length) return null;
  var pool = Object.keys(T).map(function(k){ return T[k]; }).filter(function(t){
    return t.kind === "noticed" && shown(t) && (C.vis === "me" || t.vis !== "me");
  }).sort(function(a, b){ return b.at - a.at; });
  for (var i = 0; i < pool.length; i++){
    var txt = plain(pool[i].text).toLowerCase();
    for (var j = 0; j < hit.length; j++){ if (txt.indexOf(hit[j]) >= 0) return pool[i]; }
  }
  return null;
}
function sayInner(){

    (inIris ? (S.irisMode === "desk" ? '' : '<button class="x iris-say-x" data-act="iris-draft-close" aria-label="Fold draft drawer">'+ic("x",20)+'</button>') : '<button class="x say-x" data-act="say-close" aria-label="Close">'+ic("x",22)+'</button>')+'</div>' + sayNote();
  if (inIris) h += '<p class="iris-scope-bar"><span>'+(C.vis === "me" ? ic("lock",14)+' Private · just you' : C.vis === "all" ? 'Public' : 'Shared · '+esc(S.gname))+'</span>'+(C.fromIris || C.text.trim() ? '<button class="link" data-act="iris-draft-clear">Clear</button>' : '')+'</p>';
  if (C.mode === "multi" && !rt) return h + multiInner();

  if (C.fromIris) h += '<p class="irisline" id="c-fromiris"><span class="iris"><i>O</i></span><span>'+(C.humanEdited ? 'Your edits are locked. Iris will not overwrite this draft.' : 'Iris drafted this from your chat. Edit it or start over.')+'</span></p>';
  h += '<div class="field"><label class="sr" for="c-text">Your thought</label><textarea id="c-text" rows="3" placeholder="'+(lbPin ? DATE.place : K ? K.start : "What&#39;s on your mind?")+'">'+esc(C.text)+'</textarea>';
  h += '<p class="irisline" id="c-draft"'+(C.draft?'':' hidden')+'><span class="iris"><i>O</i></span>A draft from your reflection. In this demo it is ready-made. Iris would write it from your own words. Edit it or start over.</p>';
  h += '<p class="irisline" id="c-claim" hidden><span class="iris"><i>O</i></span><span>Iris noticed a claim inside your question: "the coach is hopeless." Slide to how true you think that is.</span></p>';

  h += '<div class="kinds" role="group" aria-label="What kind of thought is it?">'+Object.keys(KINDS).map(function(x){
    return '<button class="kbtn" data-act="kind" data-id="'+x+'" aria-pressed="'+(x===k)+'">'+kmark(x)+'<span>'+KINDS[x].type+'</span></button>'; }).join("")+'</div>';
  // nothing is said here until a kind is picked; then one line says what that kind is

    '<button class="link" id="c-date" data-act="date-open"'+(dateLinkOn() ? '' : ' hidden')+'>'+(C.date ? ic("cal",16)+esc(dateText(C.date)) : DATE.link)+'</button></div>';
  if (k === "predict" && C.dateOpen) h += dateBox();

  h += '<div class="sl" id="c-good"><p class="q">'+goodQ()+'</p>'+goodHint()+'<div id="c-good-in">'+answerLine(C.good,true,'cgood','c',null,false,false,false,null,true)+'</div></div>';

/* ---------- Single or Multi. Single is one thought. Multi is several at once: Iris distills free writing into

  else if (act === "doors-off"){ S.note = null; drawSay(); }
  else if (act === "kind"){ pickKind(id); }
  else if (act === "mode"){
    // what is already written comes along, both ways
    if (id === "multi" && !C.free.trim() && C.text.trim()) C.free = C.text;
    if (id === "single" && !C.text.trim() && C.free.trim() && !C.distilled) C.text = C.free;
    C.mode = id; S.sayOpen = true; drawSay();
  }
  else if (act === "method"){
    C.method = id;
    if (id === "manual" && !C.rows.length) C.rows = [freshRow(C.free.trim() || C.text.trim(), C.kind, C.v), freshRow()];
    drawSay();
  }
  else if (act === "free-ex"){ C.free = FREE_EX; drawSay(); }
  else if (act === "distill"){ if (!C.free.trim()) return; C.rows = distill(C.free); C.distilled = true; drawSay(); }
  else if (act === "undistill"){ C.distilled = false; drawSay(); var fa = $("#c-free"); if (fa) fa.focus(); }
  else if (act === "row-add"){ C.rows.push(freshRow()); drawSay(); var na = $("#c-row-" + (C.rows.length - 1)); if (na) na.focus(); }
  else if (act === "row-del"){ C.rows.splice(Number(id), 1); if (!C.rows.length && C.method === "manual") C.rows.push(freshRow()); drawSay(); }
  else if (act === "row-kind"){
    var kr = C.rows[Number(id)], nk = b.getAttribute("data-k"); if (!kr) return;
    if (nk === "wonder" || kr.kind === "wonder") kr.v = nk === "wonder" ? 0.50 : null;   // a question's line means something else
    kr.kind = nk; drawSay();
  }
  else if (act === "stake-all"){ stakeAll(); }
  else if (act === "ex"){
    var ex = KINDS[C.kind].ex; C.text = cap(ex[C.ex % ex.length]); C.ex++; C.draft = false;
    drawSay();
  }
  else if (act === "kf"){ F.kind = id; drawBrowse(); }
  else if (act === "clear"){ var fm = F.more; F = freshF(); F.more = fm; drawBrowse(); }
  else if (act === "words"){ openWords(); }
  else if (act === "word-choice"){ W[Number(id)]=b.getAttribute('data-word'); WP[Number(id)]=W[Number(id)]; drawWords(); }
  else if (act === "words-close"){ closeWords(); }
  else if (act === "words-use"){ SURE.forEach(function(it,i){it[1]=W[i];}); closeWords(); render(); }
  else if (act === "vis"){ C.vis = id; $("#c-vis").innerHTML = visibility(C.vis,'vis'); }
  else if (act === "stake"){ if (autoKind()){ openReview(); return; } if (!ready()) return; var says = irisSays(); if (says) openPop(says); else stake(); }
  else if (act === "pop-use"){
    // the same reset a change of kind always does: a question's line means something else
    C.kind = id; C.v = id === "wonder" ? 0.50 : C.v; C.good = id === "wonder" ? null : C.good; C.questionMoved = false;
    closePop(); stake();
  }
  else if (act === "pop-keep"){ closePop(); stake(); }
  else if (act === "review"){ if (C.text.trim()) openReview(); }
  else if (act === "rev-use"){ C.kind = id; C.v = v; if (id === "wonder") C.good = null; closePop(); stake(); }
  else if (act === "f-more"){ F.more = !F.more; drawBrowse(); }
  else if (act === "f-old"){ F.old = !F.old; drawBrowse(); }
  else if (act === "f-any"){ F.from = SPAN; F.to = 0; drawBrowse(); var fa2 = $("#f-from"); if (fa2) fa2.focus(); }
  else if (act === "lists"){ S.listEdit = null; S.sure = null; openLists(); }
  else if (act === "list-new" || act === "list-edit"){ S.listEdit = act === "list-new" ? "new" : id; S.sure = null; openLists(); var ln = $("#l-name"); if (ln) ln.focus(); }
  else if (act === "list-cancel"){ S.listEdit = null; openLists(); }
  else if (act === "list-save"){
    var lname = $("#l-name").value.trim(), lwho = [].map.call(document.querySelectorAll("[data-list-who]:checked"), function(x){ return x.getAttribute("data-list-who"); });
    if (!lname){ toast("Give the list a name."); return; }
    if (!lwho.length){ toast("Tick at least one person."); return; }
    var lcur = S.listEdit !== "new" ? listOf(S.listEdit) : null;
    if (lcur){ lcur.name = lname; lcur.who = lwho; } else { S.ids = (S.ids || 0) + 1; S.lists.push({id:"l" + S.ids, name:lname, who:lwho}); }
    S.listEdit = null; openLists(); drawBrowse(); toast("Saved.");
  }
  else if (act === "list-del"){
    if (S.sure !== "ld:"+id){ S.sure = "ld:"+id; openLists(); return; }
    S.sure = null; S.lists = S.lists.filter(function(l){ return l.id !== id; }); if (F.who === "list:"+id) F.who = "all"; openLists(); drawBrowse(); toast("Deleted.");
  }
  else if (act === "list-use"){ F.who = "list:"+id; closeSheet(); drawBrowse(); }
  else if (act === "row-good"){ var gg = C.rows[Number(id)]; if (gg){ gg.gOpen = true; drawSay(); } }
  else if (act === "row-split"){
    var sr = C.rows[Number(id)], parts = sr ? distill(sr.text) : [];
    if (parts.length > 1){ C.rows.splice.apply(C.rows, [Number(id), 1].concat(parts.map(function(p){ return freshRow(p.text, sr.kind, sr.v); }))); drawSay(); }
  }
  else if (act === "pop-cancel"){ closePop(); var t3 = $("#c-text"); if (t3) t3.focus(); }
});
document.addEventListener("input", function(e){
  var el = e.target, had;
  if (el.getAttribute && el.getAttribute("data-word-own") != null){ wordOwn(el); return; }
  if (el.id === "r-text"){
    had = R.text.trim().length > 0;
    R.text = el.value; R.example = null;
    if (had !== (R.text.trim().length > 0)) $("#r-follow").innerHTML = reflectionFollowup();
    return;
  }
  if (el.id === "c-text"){
    had = C.text.trim().length > 0; C.text = el.value;
    var has = C.text.trim().length > 0;
    if (!has){ C.draft = false; C.draftText = ""; }
    if (C.fromIris){
      C.editedText = true;
      if (!C.humanEdited){
        C.humanEdited = true;
        var fi2 = $("#c-fromiris span:last-child"); if (fi2) fi2.textContent = "Your edits are locked. Iris will not overwrite this draft.";
      }
    }
    if (had !== has && C.kind === "wonder"){ if (has && C.v == null) C.v = 0.50; $("#c-sure-in").innerHTML = sureLine(); }
    syncSay(); return;
  }
  if (el.id === "c-free"){
    C.free = el.value; var fh = C.free.trim().length > 0, db = $("#c-distill"), fx = $("#c-free-ex");
    if (db) db.disabled = !fh; if (fx) fx.hidden = fh; return;
  }
  if (el.hasAttribute && el.hasAttribute("data-row-text")){ var rw = C.rows[Number(el.getAttribute("data-row-text"))]; if (rw){ rw.text = el.value; syncMulti(); var sb = $('[data-split="'+el.getAttribute("data-row-text")+'"]'); if (sb) sb.hidden = distill(rw.text).length < 2; } return; }
  if (el.id === "f-q"){ F.q = el.value; drawList(); return; }
  if (el.id === "f-from" || el.id === "f-to"){
    var lo = $("#f-from"), hi = $("#f-to");
    if (Number(hi.value) < 1) hi.value = 1;
    if (Number(lo.value) > Number(hi.value)){ if (el === lo) lo.value = hi.value; else hi.value = lo.value; }
    F.from = SPAN - Number(lo.value); F.to = SPAN - Number(hi.value);
    var sp = $("#f-span"); sp.style.left = (Number(lo.value) / SPAN * 100)+"%"; sp.style.right = (100 - Number(hi.value) / SPAN * 100)+"%";
    lo.className = Number(lo.value) > SPAN / 2 ? "top" : "";
    $("#f-when-read").textContent = whenLine(); $("#f-any").hidden = anyTime(); drawList(); return;
  }
  var act = el.getAttribute && el.getAttribute("data-range");
  if (act) setAnswer(act,el.getAttribute('data-id'),parseFloat(el.value),el.closest('.answer'));
});
document.addEventListener("change", function(e){
  if (e.target.id === "f-who"){
    if (e.target.value === "new"){ e.target.value = F.who; S.listEdit = null; S.sure = null; openLists(); return; }
    F.who = e.target.value; drawList();
  }
  if (e.target.id === "i-steps"){ S.maxSteps = Number(e.target.value); toast("Saved."); }
  if (e.target.id === "desk-asof"){ S.deskAsOf = Number(e.target.value) || 0; render(); toast(S.deskAsOf ? "Rewound Iris to "+asOfShort(S.deskAsOf)+"." : "Iris is reading up to Now."); }
  if (e.target.id === "f-topic"){ F.topic = e.target.value; drawList(); }
  if (e.target.id === "f-kind"){ F.kind = e.target.value; drawBrowse(); var fk = $("#f-kind"); if (fk) fk.focus(); }
  if (e.target.id === "f-src"){ F.src = e.target.value; pruneLists(); drawBrowse(); var fs = $("#f-src"); if (fs) fs.focus(); }
  if (e.target.id === "c-seen"){
    var nv = e.target.value;
    if (nv !== "me" && C.refs.some(function(rid){ return T[rid] && T[rid].vis === "me"; })){
      C.vis = "me"; C.privWarn = true; e.target.value = "me"; drawSay(); return;
    }
    C.vis = nv; C.privWarn = false;
    if (S.tab === "iris") drawSay();
  }
  if (e.target.hasAttribute("data-row-on")){ var ri = e.target.getAttribute("data-row-on"); if (C.rows[ri]){ C.rows[ri].on = e.target.checked; drawSay(); var rb = $('[data-row-on="'+ri+'"]'); if (rb) rb.focus(); } }
  if (e.target.id === "y-model"){ S.model = e.target.value; toast("Saved."); }
  if (e.target.id === "c-topic"){ C.topic = e.target.value; }
  if (e.target.id === "c-day"){ var lab = e.target.value >= todayISO() && e.target.value <= "2099-12-31" ? dayLabel(e.target.value) : ""; if (lab) setDate({label:lab, iso:e.target.value}); }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target.id === "chat-q"){ chatSay(e.target.value); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("iris-rail")){ e.preventDefault(); e.target.click(); return; }
  if (e.key !== "Escape") return;
  if ($("#pop")) closePop(); else if ($("#more-sheet")) closeSheet(); else if ($("#who-sheet")) closeWho(); else if ($("#words-sheet")) closeWords();
});
function setIrisLit(id){
  if (S.irisLit === id) return;
  S.irisLit = id;
  document.querySelectorAll("[data-cite],[data-lrow]").forEach(function(n){
    var k = n.getAttribute("data-cite") || n.getAttribute("data-lrow");
    n.classList.toggle("lit", !!id && k === id);
  });
}
document.addEventListener("mouseover", function(e){
  if (S.tab !== "iris") return;
  var hit = e.target && e.target.closest ? e.target.closest("[data-cite],[data-lrow]") : null;
  setIrisLit(hit ? (hit.getAttribute("data-cite") || hit.getAttribute("data-lrow")) : null);
});
function fromHash(){
  var h = (location.hash || "").replace("#", "");
  if (h === "big-group"){ if (!(S.view === "day" && S.big)) setView("day", true, true); }
  else if (h === "date-arrived"){ if (!(S.view === "day" && S.due)) setView("day", true, false, true); }
  else if (h === "ordinary-day"){ if (S.view !== "day" || S.big || S.due) setView("day", true); }
  else if (h === "first-visit" && S.view !== "first") setView("first", true);
}
window.addEventListener("hashchange", fromHash);
render(false); fromHash();
})();
</script>
